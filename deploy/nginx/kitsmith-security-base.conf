# /etc/nginx/snippets/kitsmith-security-base.conf — the headers every response carries, whatever
# its framing policy. Included by kitsmith-security.conf (framing: same origin only) and directly
# by the embed location (framing: any https page). Never include this alone anywhere else.
add_header X-Content-Type-Options    "nosniff"                         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=15552000"                always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
