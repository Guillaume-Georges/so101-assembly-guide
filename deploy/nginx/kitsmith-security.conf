# /etc/nginx/snippets/kitsmith-security.conf — included in every disk-serving location
# except the embed route, which includes kitsmith-security-base.conf with its own framing policy
# (nginx add_header does not inherit into a location that declares its own add_header).
include snippets/kitsmith-security-base.conf;
add_header X-Frame-Options           "SAMEORIGIN"                      always;
