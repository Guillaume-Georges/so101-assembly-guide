# /etc/nginx/sites-available/kitsmith.dev — enabled as /etc/nginx/sites-enabled/zz-kitsmith.dev.
# The zz- prefix matters: this box declares no default_server, so nginx's implicit default is the
# vhost file that sorts first; a file named kitsmith.dev would silently become the default for
# unknown Host/SNI on 80 and 443 and change behaviour for the existing sites.
# kitsmith.dev behind Cloudflare (proxied, SSL mode Full (strict)) with a Cloudflare Origin
# Certificate. certbot is NOT involved with this vhost: no renewals, no nginx restarts.
# Static site only; every build happens in GitHub Actions. Root is the `current` symlink,
# swapped atomically per release by /usr/local/bin/kitsmith-deploy.

# Access log = combined + two fields for /usr/local/bin/kitsmith-traffic (deploy/stats/): the owner
# cookie (set by /_self below, "-" for everyone else) and Cloudflare's country header. Defined here,
# at http level through the sites-enabled include, so it exists only for this vhost's access_log;
# the name is prefixed because log_format names are global across the box's sites.
# Docs: docs/ops/traffic-report.md.
log_format kitsmith_v2 '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" "$cookie_ks_self" "$http_cf_ipcountry"';

server {
    listen 80;
    listen [::]:80;
    server_name kitsmith.dev www.kitsmith.dev;
    return 301 https://kitsmith.dev$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.24: `http2 on;` only exists from 1.25.1
    listen [::]:443 ssl http2;
    server_name kitsmith.dev www.kitsmith.dev;

    # Cloudflare Origin Certificate (15-year), root:root 0600; chain not needed (Cloudflare pins its own CA)
    ssl_certificate     /etc/ssl/kitsmith/origin.pem;
    ssl_certificate_key /etc/ssl/kitsmith/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kitsmith_ssl:5m;

    # Authenticated Origin Pulls: only Cloudflare's edge (presenting its client cert) may reach this
    # vhost. Enable AOP on the Cloudflare zone BEFORE pointing DNS here, or the edge gets 400s.
    ssl_client_certificate /etc/ssl/kitsmith/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # www -> apex (Cloudflare also does this; belt and braces)
    if ($host = www.kitsmith.dev) { return 301 https://kitsmith.dev$request_uri; }

    root /var/www/kitsmith.dev/current;
    index index.html;

    access_log /var/log/nginx/kitsmith.dev.access.log kitsmith_v2;
    error_log  /var/log/nginx/kitsmith.dev.error.log warn;

    # Real client IP from Cloudflare (logging + any future rate limit); list refreshed from
    # https://www.cloudflare.com/ips/ — ranges live in snippets/cloudflare-realip.conf
    include snippets/cloudflare-realip.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml text/xml application/xml model/gltf-binary;
    # no ngx_brotli on this build (discovery 2026-09-07): gzip only

    # Hashed Astro assets and published geometry: immutable for a year
    location ^~ /_astro/ {
        include snippets/kitsmith-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ ^/so101/geometry/ {
        include snippets/kitsmith-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { model/gltf-binary glb; application/json json; }
        try_files $uri =404;
    }
    # OG cards and per-arm data endpoints: content-addressed by deploy, purged on deploy
    location ~ ^/so101/(og|data)/ {
        include snippets/kitsmith-security.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location = /robots.txt  { include snippets/kitsmith-security.conf; add_header Cache-Control "public, max-age=300" always; }
    location = /sitemap-index.xml { include snippets/kitsmith-security.conf; add_header Cache-Control "public, max-age=300" always; }

    # Embed pages (/{guide}/embed/{assembly}/{step}/) exist to be iframed by other sites: vendor
    # wikis, a Hugging Face Space. Every other page stays SAMEORIGIN. No X-Frame-Options here:
    # browsers that see both headers let frame-ancestors win, but an old one would honour XFO.
    # Embed pages are noindex, read-only and carry no state-changing action, so framing them is
    # not a clickjacking surface. Any guide's embed route, not only /so101/.
    location ~ ^/[a-z0-9-]+/embed/ {
        include snippets/kitsmith-security-base.conf;
        add_header Content-Security-Policy "frame-ancestors 'self' https:" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Owner tagging. Opening /_self once in a browser marks that browser as the site owner, so
    # kitsmith-traffic files its requests under "You" whatever network it is on (VPN, travel).
    # Visitors never receive this cookie; nothing on the site reads it; only the access log records it.
    # SameSite=None so it also rides along in the Hugging Face Space iframes where the browser
    # allows third-party cookies. /_self/off clears it. Automation sends `ks_self=auto` itself.
    location = /_self {
        include snippets/kitsmith-security.conf;
        add_header Set-Cookie "ks_self=1; Path=/; Max-Age=34560000; Secure; HttpOnly; SameSite=None" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        default_type text/plain;
        return 200 "This browser is now tagged as the site owner in kitsmith.dev traffic reports (400 days).\nUndo: https://kitsmith.dev/_self/off\n";
    }
    location = /_self/off {
        include snippets/kitsmith-security.conf;
        add_header Set-Cookie "ks_self=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=None" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        default_type text/plain;
        return 200 "Owner tag removed from this browser.\n";
    }

    # HTML (Astro directory URLs): 5 minutes at the edge and in browsers
    location / {
        include snippets/kitsmith-security.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
