# Install once: uvx pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        exclude: ^upstream/
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: ^upstream/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, html]
        exclude: ^(upstream/|pnpm-lock\.yaml)
      - id: validate-data
        name: validate data against schema
        entry: pnpm validate
        language: system
        pass_filenames: false
        files: ^(data/|scripts/src/)
