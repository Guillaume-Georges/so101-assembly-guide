name: Something on the site is broken
description: The 3D view does not load, a page looks wrong on your phone, a link is dead.
labels: [site]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Pixel 8, Chrome 140 · MacBook, Safari 18
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A screenshot helps; drag it in.
    validations:
      required: true
