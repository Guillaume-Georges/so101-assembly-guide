name: pages-redirect

# GitHub Pages is no longer the host (kitsmith.dev is, see deploy-kitsmith.yml). Manual only:
# publishes a redirect stub so old github.io links land on the same page at kitsmith.dev.
# Pages cannot issue a 301, so the stub uses meta-refresh + a path-preserving script.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
