name: lighthouse

# ADR-0002: SEO 100 is a hard gate on the step page template; performance is budgeted per metric and warns.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_INDEXABLE: 'true' # audit the indexable variant; the deployed site stays noindex until the domain is live
      - run: npm i -g @lhci/cli@0.15.x
      - run: lhci autorun
