name: validate

on:
  push:
  pull_request:

jobs:
  data:
    name: schema + cross-refs + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate --flags
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @so101/scripts test
      - uses: astral-sh/setup-uv@v6
      - run: uv run --directory pipeline ruff check .
      - run: uv run --directory pipeline ruff format --check .
      - name: traffic report (deploy/stats, stdlib only)
        run: |
          uvx ruff check deploy/stats
          uvx ruff format --check deploy/stats
          uv run --no-project --with pytest pytest deploy/stats -q
