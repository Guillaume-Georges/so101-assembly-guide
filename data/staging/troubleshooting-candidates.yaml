      to ttyACM0 (Slave/Follower arm), and the second device plugged in will be assigned to ttyACM1 (Master/Leader
      arm)."; line 853 "On PC (Linux) and Jetson devices, the first USB device you plug in typically maps to ttyACM0,
      and the second maps to ttyACM1. Double-check which port is mapped to the leader and follower before running
      commands." The anchors the inventory named (#find-port-usb-not-removed, #port-mapping-ttyACM) are NOT real anchors
      on that page — the page''s headings are listed at lines 27-3005 and contain neither — so citing them would be a
      fabricated citation; both rows cite the page URL exactly as SOURCES.md row 24 gives it, with the section in note.
