  - id: calibration-range-outside-expected-bounds
    slug: gripper-range-out-of-bounds-calibration
    title:
      Wrong motor position range detected for gripper. Expected to be in nominal range of [0, 100] % (a full linear
      translation), with a maximum range of [-10, 110] % to account for some imprecision during calibration, but present
      value is inf %.
    aliases:
      - 'JointOutOfRangeError: Wrong motor position range detected for gripper'
      - 'ValueError: No integer found between bounds [low_factor=np.float32(0.15283203),
        upp_factor=np.float32(0.27294922)]'
      - 'ValueError: No integer found between bounds [low_factor=np.float32(-0.0007324219),
        upp_factor=np.float32(-0.0007324219)]'
      - GripperLeader calibration error
      - but present value is -127.23577117919922 %
      - 'RuntimeWarning: divide by zero encountered in scalar divide'
    symptoms:
      - teleoperate or calibrate raises JointOutOfRangeError for the gripper before either arm moves
      - 'A RuntimeWarning: divide by zero encountered in scalar divide is printed just before the error'
      - The calibration json shows the same number in start_pos and end_pos for the gripper, so the range is zero and
        the present value is inf
      - The terminal does not say which arm failed, so the follower is recalibrated when the leader is the problem
      - One reporter instead found the grip gives a wider angle than the software limits allow
      - Other reporters in the same thread blame reversed motor IDs, a USB-A 2.0 cable, or simply not holding each
        calibration pose
    cause:
      The gripper's recorded start and end calibration positions came out identical, giving a zero range and an inf
      percentage by zero division.
    fix:
      Recalibrate, holding each pose long enough and taking the gripper through its true closed and open limits so
      start_pos and end_pos differ.
    related_steps:
      - F-002
      - L-002
      - F-063
      - L-063
    related_parts:
      - servo-sts3215-c001-345
      - servo-sts3215-c046-147
