  - id: record-keyboard-shortcuts-not-working
    slug: record-keyboard-shortcuts-no-response
    title: Keyboard shortcuts do not work during recording
    aliases:
      - If keyboard not work, you may need install other version of pynput
      - right arrow / left arrow / ESC does not respond during dataset recording
