      - ref: https://github.com/huggingface/lerobot/issues/2209#issuecomment-3454317903
        retrieved: 2026-09-09
        note: comment 4 by Daniel-rmc (NONE) — the reporter, cause and both fixes
      - ref: https://github.com/huggingface/lerobot/issues/2209#issuecomment-3684841204
        retrieved: 2026-09-09
        note: comment 6 by juliobellano (NONE) — second builder confirms
      - ref: https://github.com/huggingface/lerobot/issues/2556
        retrieved: 2026-09-09
        note: issue body — the device-side assert variant
    unverified: false
    scope: lerobot-software
    frequency: 2
    confidence: confirmed
    review_notes: >-
      Fix, reporter: "After several days of attempts, I have resolved this issue by specifying the video backend with
      --dataset.video_backend pyav." — https://github.com/huggingface/lerobot/issues/2209#issuecomment-3454108923
      (comment 3, Daniel-rmc, the thread author). Cause and the alternative fix, same reporter: "It has been confirmed
      that the bug originates from an ABI instability caused by version incompatibility between TorchCodec and PyTorch,
      triggering underlying C++ code errors. Solution: Upgrade TorchCodec to v0.8 to ensure compatibility with PyTorch
      2.9. OR Explicitly specify `--dataset.video_backend pyav` to bypass TorchCodec for video decoding." —
      https://github.com/huggingface/lerobot/issues/2209#issuecomment-3454317903 (comment 4). Independently confirmed by
      two more builders: "This fix my problem too with `pip install -U torchcodec`" —
      https://github.com/huggingface/lerobot/issues/2209#issuecomment-3684841204 (comment 6, juliobellano, NONE), and
      "Man, you are my hero !!! I stuck here for 2 weeks." (comment 5, YanShuo1992, NONE). No maintainer ever commented
      on this thread — the confirmation is reporter + two users, which is why `cause` attributes the ABI wording to the
      reporter rather than asserting it as established. SPLIT DECISION NEEDED: #2556's "RuntimeError: CUDA error:
      device-side assert triggered" (zero comments, open, `lerobot-train --policy.type=smolvla` on
