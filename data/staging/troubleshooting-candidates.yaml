      field: Maximellerbach (MEMBER) at #3723 comment 1, "I think this as already been solved in: <PR 3506>. It should
      be able to use it already on main.", validated by the reporter at comment 2, "Validated on SO-101 hardware (SO-101
      follower + SO-101 leader, Ubuntu, CUDA). The upstream smooth handover in #3506 works correctly"
      (https://github.com/huggingface/lerobot/issues/3723#issuecomment-4659491161, comment 2); the underlying gap there
