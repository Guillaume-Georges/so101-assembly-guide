  - id: editable-install-plugins-not-registered
    slug: editable-install-third-party-plugins-unloaded
    title:
      Third-party robots, cameras, and teleoperators are not loaded when installing the package in editable mode (pip
      install -e .).
    aliases:
      - register_third_party_devices() does not import my editable module
      - __editable___lerobot_teleoperator_so101_leader_dora_0_1_0_finder
      - lerobot_teleoperator_* plugin not discovered
    symptoms:
      - A custom `lerobot_robot_*` / `lerobot_camera_*` / `lerobot_teleoperator_*` package installed with `pip install
        -e .` is never imported by `register_third_party_devices()`
      - "`pkgutil.iter_modules()` shows the plugin only under a wrapped name:
        `['__editable___lerobot_teleoperator_so101_leader_dora_0_1_0_finder']`"
    cause:
      Under PEP 660 an editable install exposes the package as `__editable___<name>_finder`, so LeRobot's prefix match
      on `lerobot_robot_` / `lerobot_camera_` / `lerobot_teleoperator_` never matches and the plugin is not imported.
    fix: 'Fixed upstream in PR #2687 per the maintainer.'
    source:
      - ref: https://github.com/huggingface/lerobot/issues/2460
        retrieved: 2026-09-09
        note: issue body
      - ref: https://github.com/huggingface/lerobot/issues/2460#issuecomment-3877967442
        retrieved: 2026-09-09
        note: comment 2 by imstevenpmwork (COLLABORATOR)
