  - id: record-resume-num-episodes-semantics
    slug: resume-record-num-episodes-is-additional
    title: When resuming a recording, --dataset.num_episodes means additional episodes, not the total target
    aliases:
      - When resuming, set --dataset.num_episodes to the number of additional episodes to record (not the targeted total
        number of episodes in the dataset)
      - --resume=true
      - how many episodes to set when resuming lerobot-record
    symptoms:
      - a recording was interrupted and is continued by re-running the same command with `--resume=true`, and it is
        unclear what `--dataset.num_episodes` should be set to
      - the same wiki page's parameter table describes `--dataset.num_episodes` as "Total episodes to record", which
        reads as the dataset total rather than the number still to record
    cause:
      On a resumed recording `--dataset.num_episodes` is the number of additional episodes to record, not the targeted
      total number of episodes in the dataset.
    fix:
      When resuming with `--resume=true`, set `--dataset.num_episodes` to the number of additional episodes you still
      want; to start recording from scratch instead, manually delete the dataset directory.
