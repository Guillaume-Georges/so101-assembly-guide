      "You can also try") and no thread in the corpus shows a builder confirming either step worked, so `unverified:
      true`. THE SECOND THREAD IS A DIFFERENT FAILURE, kept as symptom 2 per the cluster note and NOT merged into one
      cause: #4483 is a crash, not an unresponsive key, and its reporter root-caused and self-confirmed it — "The
      `record_loop` function is called twice per episode in `lerobot-record` – once for the recording phase and once for
