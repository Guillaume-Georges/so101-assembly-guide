  - id: calibration-not-persisted
    slug: calibration-not-written-to-motors
    title: Calibration parameters are not written to motors
    aliases:
      - Script python -m lerobot.calibrate --teleop.type=so101_leader --teleop.port=/dev/ttyACM1 --teleop.id=the_leader
        does not create calibration file
      - Calibration is not read correctly on SO101 follower
      - Teleoperation is not working because it asks again and again to calibrate
      - How do I recalibrate after repair or part replacement?
    symptoms:
      - the first teleoperate run is fine, but after Ctrl+C the next run asks for calibration again although both
        calibration JSON files exist
      - some motors have a negative homing_offset in the JSON and the servo's Position Offset register shows a large
        positive value such as 65353 instead
      - calibrating the leader prints the range table but never the 'Calibration saved to ...' line, while the follower
        does
      - one run ignored an existing calibration file and the reporter could not reproduce it five minutes later
    cause:
      Not established in the public record; the reporter's own analysis is that negative homing_offset values in the
      calibration file are stored by the servo's unsigned Position Offset register as a large positive number, so the
      stored and on-motor values never match.
    fix: No confirmed fix in the public record as of 2026-09-09.
    source:
      - ref: https://github.com/huggingface/lerobot/issues/1342
        retrieved: 2026-09-09
        note: issue body (verbatim title; 8 comments, no maintainer reply, closed as stale)
      - ref: https://github.com/huggingface/lerobot/issues/1328
        retrieved: 2026-09-09
