  - id: find-cameras-read-thread-race
    slug: find-cameras-nonetype-has-no-attribute-is-set
    title: "AttributeError: 'NoneType' object has no attribute 'is_set'"
    aliases:
      - Race-condition in lerobot-find-cameras opencv
      - Exception in thread OpenCVCamera(/dev/video24)_read_loop
      - while not self.stop_event.is_set()
    symptoms:
      - "`lerobot-find-cameras opencv` prints `Exception in thread OpenCVCamera(...)_read_loop` with `AttributeError:
        'NoneType' object has no attribute 'is_set'` at camera_opencv.py `_read_loop`, while the script keeps running —
        which the reporter calls very confusing"
      - 'Accompanied by `Failed to connect or configure OpenCV camera /dev/videoN: Timed out waiting for frame ... Read
        thread alive: True`'
      - Triggered consistently on the reporter's Raspberry Pi and from time to time on their desktop
    cause:
      '`OpenCVCamera._stop_read_thread()` sets `self.stop_event = None` immediately after signalling the thread and a
      `join(timeout=2.0)`, so a background read thread still evaluating `while not self.stop_event.is_set():`
      dereferences None and crashes.'
    fix:
      "Use a version that includes PR #3812, which a maintainer states fixed it; the reporter's own suggestion is to
      remove the line that sets `self.stop_event = None` inside `_stop_read_thread()`."
    source:
      - ref: https://github.com/huggingface/lerobot/issues/3569
        retrieved: 2026-09-09
        note: issue body
      - ref: https://github.com/huggingface/lerobot/issues/3569#issuecomment-5154448405
        retrieved: 2026-09-09
        note: comment 1 by zuoxingdong (COLLABORATOR)
    unverified: false
    scope: lerobot-software
    frequency: 1
    confidence: confirmed
    review_notes:
      'Cause, issue body (reporter AnesBenmerzoug, CONTRIBUTOR): "When `disconnect()` or `_stop_read_thread()`
      is called, the method sets `self.stop_event = None` immediately after signaling the thread and waiting for just 2
      seconds (`join(timeout=2.0)`). If the background thread is still executing its loop condition `while not
      self.stop_event.is_set():` ... it accesses `self.stop_event.is_set()` on a None object, crashing the thread. This
      triggered consistently on the raspberry pi I am using but also from time to time on the desktop I used for
      testing." — https://github.com/huggingface/lerobot/issues/3569 (issue body). Fix, maintainer: "fixed by #3812" —
      https://github.com/huggingface/lerobot/issues/3569#issuecomment-5154448405 (comment 1, zuoxingdong, COLLABORATOR).
      Reporter''s own suggestion, issue body: "What I suggest is much simpler: Simply remove the line that sets
      `self.stop_event = None` inside `_stop_read_thread()`." Version-bound: lerobot 0.5.2 on Raspberry Pi (Linux
      aarch64), Python 3.12.13 — fixed after that by PR #3812; the reporter also names an earlier attempt PR #3012. The
      error is cosmetic in the sense the reporter states the script continues running; the real blocker in the log is
      the frame timeout. related_steps/related_parts empty: cameras are not in data/parts.yaml and no assembly step is
      implicated. VERIFIED 2026-09-09 (adversarial pass): re-opened corpus/lerobot/3569.json — the title string is
      verbatim in the traceback (at camera_opencv.py line 443 in `_read_loop`), all three aliases are verbatim, the long
      cause quote is verbatim from the Description including "Which is apparently normal as the script just continues
      running even when that happens, which is very confusing", symptom 2''s log line is verbatim ("Failed to connect or
      configure OpenCV camera /dev/video0: Timed out waiting for frame from camera OpenCVCamera(/dev/video0) after 1000
      ms. Read thread alive: True."), the reporter''s suggestion and the #3012 reference are verbatim from "Additional
      Info / Workarounds", the thread author''s association really is CONTRIBUTOR, and the sole comment is exactly
      "fixed by #3812" from zuoxingdong (COLLABORATOR) at the cited permalink. The title does not collide with
      gym-manipulator-sim-imitation-error''s AttributeError (different attribute).'
