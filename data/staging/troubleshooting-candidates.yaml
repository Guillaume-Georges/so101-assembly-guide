  - id: async-server-gpu-client-cpu-device-mismatch
    slug: async-cuda-deserialize-on-cpu-client
    title: 'RuntimeError: Attempting to deserialize object on a CUDA device but torch.cuda.is_available() is False.'
    aliases:
      - "RuntimeError: Attempting to deserialize object on a CUDA device but torch.cuda.is_available() is False. If you
        are running on a CPU-only machine, please use torch.load with map_location=torch.device('cpu') to map your
        storages to the CPU."
      - Async Inference Runtime Error when running pi0.5 policy server on GPU device and robot_client on CPU device
      - Policy server cuda, robot client on cpu - tensor mismatch
      - Exception in thread Thread-1 (receive_actions)
    symptoms:
      - The robot client connects, sends the policy instructions, then the action receiving thread dies on the first
        chunk and the robot never moves
      - The traceback ends in pickle.loads(actions_chunk.data) inside robot_client.receive_actions
      - The setup is a policy server on a CUDA machine with the robot client on a CPU-only machine (Windows 11 laptop,
        Ubuntu CPU host, Mac)
    cause:
      The async policy server sends action chunks whose tensors are still on the CUDA device, so a CPU-only robot
      client cannot deserialize them — a maintainer describes it as a disconnect between the device the chunks are
      generated on and the device they are sent out to.
    fix:
      'Update to a LeRobot that contains PR #2792, which a collaborator states fixed it; before that fix, users either
      ran the client with device cpu or moved the action tensor to CPU in policy_server.py.'
