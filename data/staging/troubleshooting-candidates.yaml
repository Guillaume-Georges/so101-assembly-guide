  - id: policy-trained-but-robot-barely-moves
    slug: trained-policy-barely-moves-or-misses-grasp
    title: Poor ACT Policy Performance After Training (Robot Not Moving or Grasping Properly)
    aliases:
      - smolvla model not working properly
      - robot stays static or moves unpredictably
      - Difficulties with finetuning SmolVLA.
      - diffusion policy is not working when deployed on the real device
      - Debugging poor eval with SmoVLA and two cameras.
      - '[X-VLA] Poor spatial precision and background sensitivity after fine-tuning with 150 episodes'
      - the arm just moved a centimeter and then kept idle
      - robot not moving or grasping properly
    symptoms:
      - after 100k training steps the policy shows almost no meaningful motion and never approaches or grasps the
        object, although training loss fell and the dataset looks fine
      - the arm approaches roughly the right area but the gripper does not close enough to grasp
      - SmolVLA shakes or loops at the start pose while ACT trained on the same dataset works
      - the policy reaches the centre of the board instead of the target and only recovers when the target enters the
        wrist camera's field of view
      - success degrades when the background or table changes
      - 0/5 eval episodes succeed on a bimanual SO-101 recalibrated between recording and inference
      - the arm moves a centimetre then stays idle on a Jetson Orin Nano
    cause:
      A LeRobot contributor attributes the failures to dataset quality and coverage rather than to code - too few
      episodes, only one episode per object position, very short or jerky episodes, and two cameras that see the same
      view instead of one top view plus one gripper view.
    fix:
      One reporter got SmolVLA working by raising the dataset from 40 to 80 episodes, and a contributor recommends
      several episodes per object position, slow smooth recordings and a top-view plus gripper-view camera pair - but
      several other reporters in the same thread saw no improvement at 77-220 episodes, so no fix is established.
    source:
      - ref: https://github.com/huggingface/lerobot/issues/2213
        retrieved: 2026-09-09
        note: issue body (title verbatim as the issue title)
      - ref: https://github.com/huggingface/lerobot/issues/2213#issuecomment-4409810621
