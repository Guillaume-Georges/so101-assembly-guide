  - id: smolvla-lora-alpha-defaults-to-8
    slug: lora-alpha-defaults-to-8-high-rank
    title: PeftConfig missing lora_alpha field — defaults to 8, dampens high-rank LoRA
    aliases:
      - Robot barely moves at deployment
      - the base model (`smolvla_base`, untuned for the target embodiment) dominates output, and the LoRA adapter is too
        weak to overcome it
    symptoms:
      - '"Robot barely moves at deployment — the base model (`smolvla_base`, untuned for the target embodiment)
        dominates output, and the LoRA adapter is too weak to overcome it"'
      - '"Same behavior across multiple checkpoints trained with different data (confirmed on SO-101 arm)"'
    cause:
      PeftConfig in src/lerobot/configs/default.py defines the LoRA rank r but no lora_alpha field, so PEFT's default
      alpha of 8 applies at any rank and scales the adapter by alpha/r — 0.125x at r=64 — leaving the trained adapter
      too weak to overcome the base model.
    fix:
      'Not confirmed: the reporter proposes adding a lora_alpha field to PeftConfig so it can be set to the training
      rank, and reports that editing "lora_alpha" from 8 to 64 in the cached adapter_config.json made the robot move
      immediately but overshoot, because the weights had been trained under 0.125x scaling.'
    source:
      - ref: https://github.com/huggingface/lerobot/issues/3551
        retrieved: 2026-09-09
        note: issue body
    unverified: true
    scope: lerobot-software
    frequency: 1
    confidence: reported
    review_notes:
      'VERIFIED against corpus/lerobot/3551.json, no changes. Cause, issue body: "`PeftConfig` in
      `src/lerobot/configs/default.py` defines `r` (rank) but has **no `lora_alpha` field**. The PEFT library''s
      `LoraConfig` defaults `lora_alpha` to 8 regardless of rank." and "At r=64, the LoRA contribution is dampened 8x
      compared to alpha=r." — the scaling table (r=64 / alpha 8 / 0.125) is in the body verbatim. Fix, same body,
      Verification section: "1. Trained SmolVLA LoRA r=64 → robot near-static 2. Edited cached `adapter_config.json`:
      `\"lora_alpha\": 8` → `\"lora_alpha\": 64` 3. Re-ran deployment → robot moved immediately (overshooting, because
      weights were trained under 0.125x scaling but inferred at 1.0x)", and the Fix section''s one-line `lora_alpha: int
      = 8` addition "after r: int = 16" — https://github.com/huggingface/lerobot/issues/3551 (issue body). Both symptom
      quotes are verbatim from the body''s Symptom section. TITLE CHECK: no error string exists in this thread, and the
      title is verbatim the issue title, so it passes; the symptom phrase a builder would actually search ("Robot barely
      moves at deployment") is the first alias, which is the right split given how specific the cause is. Confirmed at
      verification: the file has ZERO comments and the state is "closed" with no comment or PR reference explaining the
      closure, so whether `lora_alpha` was exposed upstream is NOT in the public record — reported/unverified is correct
      and a reviewer must check current lerobot before promoting. The reporter verified the mechanism, not a clean fix
      (the arm overshot). No step or part id applies.'
