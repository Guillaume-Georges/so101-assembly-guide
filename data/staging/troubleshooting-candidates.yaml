  - id: goal-position-outside-calibrated-band
    slug: goal-position-outside-calibrated-band
    title: Lerobot allows writing goal positions outside of min / max
    aliases:
      - MotorsBus.write("Goal_Position", ...) accepts values outside the calibrated [Min, Max] and silently drives the
        motor
      - motor slams on startup after disable_torque
      - Torque_Enable comes back on by itself
    symptoms:
      - A `Goal_Position` write moves the motor immediately even though the host had called `disable_torque`, and
        `Torque_Enable` reads 1 afterwards
      - '"Motor moved ~3244 ticks in Present-space (~75° of physical rotation, motion crossed the encoder seam). Host
        never called `enable_torque`."'
      - '"Symptom is identical to a hardware fault (encoder slip, motor moved while powered off)" and `Goal_Position` on
        the bus still reads the value the host wrote, so nothing on the bus shows the firmware substituted a target'
      - Writing `Torque_Enable` directly with no Goal write does not move the motor, so the Goal write is what triggers
        it
    cause:
      Per the report, `MotorsBus.write` does not check `Goal_Position` against the motor's calibrated
      `range_min`/`range_max`, and the Feetech STS3215 firmware answers an out-of-band goal by clamping it to the
      nearest position limit, setting `Torque_Enable = 1` on the next PID tick regardless of a previous
      `disable_torque`, and driving to that clamped target.
    fix: No confirmed fix in the public record as of 2026-09-09.
    source:
      - ref: https://github.com/huggingface/lerobot/issues/3585
        retrieved: 2026-09-09
        note: issue body
    unverified: true
    scope: lerobot-software
    frequency: 1
    confidence: open
    review_notes:
      'VERIFIED against corpus/lerobot/3585.json. Cause, from the issue body: "Lerobot''s write path does not
      check `Goal_Position` against the motor''s calibrated `[range_min, range_max]`" and "The Feetech STS3215 firmware
      responds to such writes by: - internally clamping the goal to the nearest edge of `[Min_Position_Limit,
      Max_Position_Limit]` (wrap-aware) and using that as the PID target, - setting `Torque_Enable = 1` on the next PID
      tick regardless of the host''s previous `disable_torque` call, - driving the motor toward the clamped target."
      (https://github.com/huggingface/lerobot/issues/3585, issue body) — present verbatim. Test A in the body supports
      symptom 1 (Present_Position ~3472 after a Goal write of 228, `Goal_Position` still 228, `Torque_Enable` 1); Test B
      supports symptom 4 ("Motor sits still. Writing `Torque_Enable` directly is not what triggers the slam — the Goal
