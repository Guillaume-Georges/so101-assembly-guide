  - id: gripper-present-load-very-high
    slug: gripper-present-load-very-high
    title: Gripper servo load is very high when opening the gripper
    aliases:
      - Question - Gripper servo load is very high when opening the gripper
      - When I open the gripper, the "Present_Load" is very high, ~1042
      - Present_Load is signed
    symptoms:
      - Reading `Present_Load` on the gripper servo to estimate gripping force gives ~1042 when opening the gripper and
        ~14 when closing it without touching an object
      - The reporter states the gripper itself works well, so this is not a blocker for them
      - The reporter later reports that `Present_Load` is a signed value whose high byte carries the sign
    cause:
      The reporter found that `Present_Load` is a signed two-byte value in which the high byte encodes the sign —
      decimal 4 (binary 00000100) means negative, 0 means positive.
    fix:
      Decode `Present_Load` as a signed value (high byte 4 = negative, 0 = positive) before using it as a force estimate;
      the thread never states whether that accounts for the whole difference between the two readings.
    source:
      - ref: https://github.com/TheRobotStudio/SO-ARM100/issues/26
        retrieved: 2026-09-09
        note: issue body
      - ref: https://github.com/TheRobotStudio/SO-ARM100/issues/26#issuecomment-2568546937
        retrieved: 2026-09-09
        note: comment 1 by nomorewzx (NONE, the reporter self-answering)
    unverified: true
    scope: firmware
    frequency: 1
    confidence: reported
    review_notes:
      'Symptom, issue body (reporter nomorewzx, NONE): "1. When I open the gripper, the \"Present_Load\" is very
      high, ~1042 2. When I close the gripper without touching any object, the \"Present_Load\" is very low, ~14 ...
      This is not a major blocker to me since the gripper works pretty well." —
      https://github.com/TheRobotStudio/SO-ARM100/issues/26 (issue body). Cause/fix, reporter self-answer: "I found that
      the \"Present_Load\" value is signed, in an interesting way. The value consists of 2 bytes, the higher byte
      represents the positive/negtive and 1. when the higher bytes decimal value is 4 (binary value `00000100`), it
      represents a negative value. 2. when the higher bytes is 0, it represents a positive value" —
      https://github.com/TheRobotStudio/SO-ARM100/issues/26#issuecomment-2568546937 (comment 1). WHAT THE SOURCE DOES
      AND DOES NOT SUPPORT: it supports only the register sign encoding. It does NOT state that decoding the sign
      reconciles 1042 against 14, and it does not rule out a mechanical/direction-dependent load. No arithmetic was
      added here on purpose (no decoded magnitude is computed). Hence confidence `reported` and unverified: true,
      against the cluster''s "reporter-confirmed" read: nothing in the record confirms the interpretation resolves the
      observation. Scope set to `firmware` rather than the cluster''s `lerobot-software` because Present_Load''s
      encoding is Feetech servo-firmware register semantics, not a LeRobot install/teleop/record problem; the builder''s
