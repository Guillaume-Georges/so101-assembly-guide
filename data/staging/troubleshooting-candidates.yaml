  - id: record-video-muxing-dts
    slug: record-video-dts-out-of-order
    title: 'lerobot-record error: DTS out of order, non monotonically increasing'
    aliases:
      - '[concat] DTS 263168 < 1539000 out of order'
      - 'Application provided invalid, non monotonically increasing dts to muxer in stream 0: 1539000 >= 263168'
      - 'av.error.ValueError: [Errno 22] Invalid argument'
      - "RuntimeError: Cannot access 'time_base' as a decoder"
      - Video concatenation fails with time_base error when using resume=true in lerobot-record
      - "AttributeError: 'float' object has no attribute 'numerator'"
    symptoms:
      - lerobot-record aborts after the first episode inside save_episode -> _save_episode_video ->
        concatenate_video_files with a DTS out of order error
      - "Re-running lerobot-record with --resume=true raises RuntimeError: Cannot access 'time_base' as a decoder in the
        same concatenation function"
      - "Processing a dataset whose fps metadata is a float crashes with AttributeError: 'float' object has no attribute
        'numerator'"
    cause:
      'The threads tie the crash to the video concatenation path in src/lerobot/datasets/video_utils.py and the pyav
      version it runs against, which the dataset refactors in PRs #1903 and #2100 bumped to av 15.0.0.'
    fix:
      Pulling main and clean-installing the environment after those dataset refactors, as a contributor advised, fixed
      the DTS crash for the reporter, who confirmed it in the thread.
