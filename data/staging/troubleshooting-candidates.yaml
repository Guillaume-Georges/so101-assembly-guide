  - id: second-camera-fails-when-both-configured
    slug: two-cameras-second-fails-usb-bandwidth
    title: 'TimeoutError: Timed out waiting for async_read() to start.'
    aliases:
      - Cannot run a record with two cameras
      - 'ConnectionError: Failed to open OpenCVCamera(/dev/video10). Run `lerobot-find-cameras opencv` to find available
        cameras.'
      - Second camera read error with so101 dual camera
      - RealSense + OpenCV camera fails to connect together in lerobot-record (works individually)
      - USB camera image data cannot be read
      - "Error reading in thread: Can't capture color image from camera 4"
      - select() timeout
    symptoms:
      - each camera records fine on its own but the second one fails as soon as both are listed in --robot.cameras
      - the RealSense connects and the OpenCV camera immediately fails with 'Failed to open OpenCVCamera'
      - with three cameras on a dual-arm setup both wrist cameras time out in async_read
      - uvcvideo 'Non-zero status (-71) in video completion handler' in dmesg before USB autosuspend was disabled
    cause: Cameras sharing one USB hub or controller do not get enough image-transmission bandwidth.
    fix: Connect each camera directly to the machine, on its own USB 3.0 port, rather than through a hub.
    source:
      - ref: https://github.com/huggingface/lerobot/issues/1179
        retrieved: 2026-09-09
        note: issue body (verbatim title string; TimeoutError, 3 cameras, dual arm)
      - ref: https://github.com/huggingface/lerobot/issues/1179#issuecomment-2926426662
        retrieved: 2026-09-09
        note: comment 1 by rancheng (NONE, reporter)
      - ref: https://wiki.seeedstudio.com/lerobot_so100m_new/
        retrieved: 2026-09-09
        note: FAQ entry 'USB camera image data cannot be read' (Seeed Studio vendor wiki)
      - ref: https://github.com/huggingface/lerobot/issues/1743
        retrieved: 2026-09-09
        note: issue body ('Cannot run a record with two cameras')
      - ref: https://github.com/huggingface/lerobot/issues/1743#issuecomment-3415152353
        retrieved: 2026-09-09
        note: comment 2 by imstevenpmwork (COLLABORATOR)
      - ref: https://github.com/huggingface/lerobot/issues/4550
        retrieved: 2026-09-09
        note: issue body; zero comments
      - ref: https://github.com/huggingface/lerobot/issues/1353
        retrieved: 2026-09-09
        note: issue body; closed as stale with no human reply
    unverified: false
    scope: lerobot-software
    frequency: 5
    confidence: confirmed
    review_notes:
      'CORRECTED: TITLE swapped. As extracted the title was #1743''s issue title, but #1743 is the one cited
      thread whose only maintainer reply says the error is NOT a camera problem ("The error in the logs attached is
      unrelated to the cameras" - https://github.com/huggingface/lerobot/issues/1743#issuecomment-3415152353, comment 2,
      COLLABORATOR, then closed as stale), so a builder pasting that string would have been sent to a fix a maintainer
      said does not apply to it. A verbatim error string exists and belongs to the thread that actually confirms the
      fix, so the title is now #1179''s "TimeoutError: Timed out waiting for async_read() to start." (verbatim in its
      title and body) and ''Cannot run a record with two cameras'' is the first alias. Cause+fix, Seeed Studio vendor
      wiki, verbatim: "Avoid connecting the USB camera through a USB hub. Connect it directly to the device, preferably
      through a USB 3.0 port, to ensure sufficient image transmission bandwidth." What carries ''confirmed'' is the
      reporter, not the wiki: "The problem was because I don''t have enough I/O bandwidth for cameras, solved by
      connecting cameras in independent USB 3.0 ports." -
      https://github.com/huggingface/lerobot/issues/1179#issuecomment-2926426662 (comment 1). COVERAGE CAVEAT a reviewer
      must read: the bandwidth cause is confirmed for #1179 (three cameras through shared ports) and asserted by the
      wiki; it does not explain the other three threads. #4550''s reporter explicitly rules it out in the issue body -
      "Not a USB bandwidth/cable issue: confirmed via `dmesg` that the RealSense negotiates a genuine SuperSpeed (USB3)
      connection on its own dedicated port, verified with a USB-IF certified 40Gbps cable" - and that thread has zero
      comments and no workaround. #1743''s attached error is an image, not text, so nothing verbatim could be taken from
      it. #1353 pastes a whole GR00T eval script with no error text at all and closed as stale. Two incidental,
      separately-sourced fixes from the #4550 body, worth keeping if this entry is promoted: disabling USB autosuspend
      for the RealSense cleared ''uvcvideo: Non-zero status (-71)'', and with backend V4L2 forced, index_or_path must be
      a bare integer, not /dev/videoN. frequency 5 = 4 GitHub threads + 1 wiki page. No related_parts: cameras and hubs
      are not in data/parts.yaml (the BOM covers the arm only), so no id was available to reference.'
