        retrieved: 2026-09-09
        note: comment 1 by Maximellerbach (MEMBER)
      - ref: https://github.com/huggingface/lerobot/issues/3723#issuecomment-4659491161
        retrieved: 2026-09-09
        note: comment 2 by anikita (NONE), the reporter
    unverified: true
    scope: lerobot-software
    frequency: 2
    confidence: confirmed
    review_notes:
      'FIXED: the fields contradicted each other. The title names the resume stale-observation defect
      (lerobot#3747, still OPEN, fix only in the unmerged PR #4398) but cause, fix and confidence: confirmed described
      the pause handover (lerobot#3723, landed in #3506). Cause and fix now describe only the titled defect, and
      confidence is downgraded to reported with unverified true. Cause, #3747 issue body: "During the correction,
      `notify_observation()` is never called [...] So `_obs_holder` still holds the last autonomous observation from
