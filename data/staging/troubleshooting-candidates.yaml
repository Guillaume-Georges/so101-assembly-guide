  - id: encoder-wrap-corrupts-recorded-range
    slug: encoder-wrap-corrupts-recorded-range
    title: '`wrist_roll` limit overflow causes wrap-around and initialization errors'
    aliases:
      - the value exceeds this range and wraps around back to 0
      - Calibration overflow protection
      - We should use homing offset to reduce the severity of wrap around bugs
      - arm slams on startup
      - motor fights the user during teleop in certain poses
    symptoms:
      - Rotating wrist_roll toward either limit makes the reported position leave the 0-4095 range and wrap back to 0,
        which breaks initialization and gives an inaccurate calibration
      - Calibration finishes with a plausible range_min < range_max, yet the joint later reports positions outside that
        band while mechanically inside its travel
      - After such a calibration the arm slams on the startup snap, or the motor fights the user in certain poses, which
        looks identical to a hardware fault
    cause:
      Per two contributor analyses, MotorsBus.record_ranges_of_motion takes naive min()/max() over mod-4096
      Present_Position samples so a range crossing the 0/4095 seam cannot be represented, and lerobot.calibrate runs
      set_half_turn_homings first, choosing the homing offset from whatever pose the user holds, which can place the
      wrap point inside the joint's mechanical travel.
    fix:
      'Proposed only: choose the homing offset after the sweep so the recorded travel is centred on Present=2048 and the
      wrap falls outside it, or keep the order and recompute the offset after record_ranges_of_motion - nothing in the
      public record confirms a merged fix.'
    related_parts:
      - servo-sts3215-c001-345
    source:
      - ref: https://github.com/huggingface/lerobot/issues/1255
        retrieved: 2026-09-09
        note: issue body
      - ref: https://github.com/huggingface/lerobot/issues/3586
        retrieved: 2026-09-09
        note: issue body by 0o8o0-blip (CONTRIBUTOR)
      - ref: https://github.com/huggingface/lerobot/issues/3586#issuecomment-4430232171
        retrieved: 2026-09-09
        note: comment 1 by moaedy (NONE)
      - ref: https://github.com/huggingface/lerobot/issues/3587
        retrieved: 2026-09-09
        note: issue body by 0o8o0-blip (CONTRIBUTOR)
    unverified: true
    scope: calibration
    frequency: 3
    confidence: reported
    review_notes:
      'VERIFIED, including the two aliases the extractor did not source. Builder-visible report and title: "when
      rotating the `wrist_roll` joint toward its limit points (expected range 0 to 4095), the value exceeds this range
      and wraps around back to 0. This wrap-around causes problems during initialization, leading to inaccurate
      calibration and control." (https://github.com/huggingface/lerobot/issues/1255, issue body; closed with zero
      comments). Cause: "`MotorsBus.record_ranges_of_motion` uses naive `min()` / `max()` over `Present_Position`
      samples to record a joint''s calibrated travel. `Present_Position` is mod-4096... When a joint''s mechanical range
      physically crosses the 0/4095 seam in Present-space, the recorded `(range_min, range_max)` cannot faithfully
      represent the actual travel: it either silently clips one side off, or - if the sweep crossed the seam during
      recording - collapses to `(≈0, ≈4095)`. Either failure mode is silent."
      (https://github.com/huggingface/lerobot/issues/3586, issue body, CONTRIBUTOR) and "`lerobot.calibrate` runs
      `set_half_turn_homings` *before* `record_ranges_of_motion`. The HO is chosen from the joint''s current pose at the
      moment the user presses ENTER, without any knowledge of where the joint''s actual mechanical extremes will turn
      out to be... the resulting HO places the encoder wrap point... somewhere inside the joint''s travel range"
      (https://github.com/huggingface/lerobot/issues/3587, issue body, CONTRIBUTOR). Third symptom and the last two
      aliases are verbatim from #3586''s Impact section: "Symptom (arm slams on startup, or motor fights the user during
      teleop in certain poses) looks identical to a hardware fault (encoder slip, magnet movement, multi-turn
      accumulation), making it very easy to misdiagnose." Fix, proposed by the same contributor: "Inverting the order
      solves this cleanly: sweep first, observe the travel range, then choose HO so the wrap point ends up *outside* the
      observed range. The simplest invariant - center the calibrated range on Present=2048..." (#3587 issue body). The
      only other comments are "Opened #3589."
      (https://github.com/huggingface/lerobot/issues/3586#issuecomment-4430232171, comment 1) - so PR #3589 exists only
      as a reference, with no state fetched - and a bystander complaint on #3587. The analyses are on shoulder_lift
      while the builder-visible thread is on wrist_roll; same mechanism per the sources, so both are kept as symptoms.
      CROSS-LINK: both #3586 and #3587 name #1296 ("calibration fails with Magnitude N exceeds 2047", closed, partial
      fix in #3373) as the original report; that thread belongs to another batch and must not be double-counted here. No
      step id applies (calibration is not an assembly step in data/assemblies); related_parts limited to the follower
      servo id.'
  - id: hil-serl-so101-leader-unsupported
    slug: hil-serl-so101-leader-unsupported
    title:
      'TypeError: Teleoperator SO101Leader must implement get_teleop_events() method. Compatible teleoperators:
      GamepadTeleop, KeyboardEndEffectorTeleop'
    aliases:
      - 'TypeError: Teleoperator SOLeader must implement get_teleop_events() method. Compatible teleoperators:
        GamepadTeleop, KeyboardEndEffectorTeleop'
      - HIL-SERL SO101 is not implemented
      - so101 can't work with HIL-SERL
      - the ee limit is very small and can't used in human intervention
    symptoms:
      - python -m lerobot.rl.gym_manipulator with teleop.type=so101_leader raises the TypeError above, in both the
        record and the training modes
      - The end-effector bounds printed by lerobot-find-joint-limits are almost identical (min and max differ in the
        third decimal), so human intervention has no usable range
      - With leader position control instead of gamepad/keyboard end-effector control the trained policy output is
        always near 0
    cause:
      A contributor's analysis of current main states the RL pipeline never reads control_mode, gym_manipulator.py
      unconditionally adds AddTeleopEventsAsInfoStep whose check rejects the SO leader class, and
      InterventionActionProcessorStep reads delta_x/delta_y/delta_z while SOLeader.get_action() returns {motor}.pos, so
      leader teleoperation and demo recording both fail.
