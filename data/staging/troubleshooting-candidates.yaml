  - id: camera-config-choice-class-not-found
    slug: camera-choice-class-not-found
    title: Couldn't find a choice class for 'realsense' in <class 'lerobot.cameras.configs.CameraConfig'>
    aliases:
      - "draccus.utils.DecodingError: `robot.cameras.left`: Couldn't find a choice class for 'realsense' in <class
        'lerobot.cameras.configs.CameraConfig'>"
      - "KeyError: 'realsense'"
      - "draccus.utils.DecodingError: `robot.cameras.front`: Couldn't find a choice class for 'zmq' in <class
        'lerobot.cameras.configs.CameraConfig'>"
      - realsense camera is not found
    symptoms:
      - lerobot.teleoperate stops before connecting as soon as a RealSense camera is added to --robot.cameras
      - 'Using type: opencv for the RealSense camera does not work either'
      - The HIL data-collection example fails the same way for a zmq camera type
    cause:
      The camera type in --robot.cameras has to be the name the config subclass is registered under — 'intelrealsense',
      whose key is serial_number_or_name and not serial — and a camera type whose config class the script never imports
      (zmq in the HIL example) is likewise not in the registry.
    fix:
      'Use type: intelrealsense with serial_number_or_name for a RealSense, and for an unregistered type import its
      config class in the script (for example from lerobot.cameras.zmq.configuration_zmq import ZMQCameraConfig).'
