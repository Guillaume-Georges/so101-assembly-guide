  - id: ffmpeg-no-valid-stream
    slug: ffmpeg-no-valid-stream-found
    title: No valid stream found in input file. Is -1 of the desired media type?
    aliases:
      - FFmpeg version issue in Ubuntu
      - libsvtav1 encoder not found
      - ffmpeg -encoders has no libsvtav1
      - "error: 'AV_OPT_TYPE_CHANNEL_LAYOUT' undeclared (first use in this function); did you mean
        'AV_OPT_TYPE_CHLAYOUT'?"
      - 'ERROR: Failed to build installable wheels for some pyproject.toml based projects (av)'
    symptoms:
      - Recording a dataset fails with "No valid stream found in input file. Is -1 of the desired media type?" when the
        episode videos are encoded
      - '`ffmpeg -encoders` in the conda environment lists no `libsvtav1`'
      - On Ubuntu 22.04, `pip install --no-binary=av -e ".[feetech]"` fails to build the `av` wheel with
        "'AV_OPT_TYPE_CHANNEL_LAYOUT' undeclared"
    cause:
      The ffmpeg in the environment lacks the `libsvtav1` encoder LeRobot uses for video (`conda install ffmpeg` can
      land 6.1.1, which is built without it), and on Ubuntu 22.04 installing ffmpeg 7 before building `av` also breaks
      the PyAV build.
    fix:
      Install ffmpeg 7.1.1 from conda-forge into the LeRobot environment — `conda install ffmpeg=7.1.1 -c conda-forge` —
      installing it after LeRobot rather than before on Ubuntu 22.04.
