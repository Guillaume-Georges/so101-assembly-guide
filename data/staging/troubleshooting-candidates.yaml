  - id: rerecorded-episode-contains-old-frames
    slug: rerecorded-episode-contains-discarded-frames
    title: re-recorded episode's video contains frames from the discarded take
    aliases:
      - clear_episode_buffer() does not delete video staging frames, so discarded takes get encoded into the re-recorded
        episode's video
      - Incorrect Number of Recorded Episodes when Rerecording
      - episode video is longer than the episode
      - parquet length and the encoded video disagree
    symptoms:
      - 'After discarding a take with the left arrow and re-recording, the saved episode''s video is longer than the
        episode: "parquet length : 10 frames = 0.333 s / encoded video : 1.000 s (30 frames)"'
      - Playback shows the arm jumping to a physically impossible pose partway through, then the discarded take
        (including a hand resetting the scene) continues to play
      - The dataset viewer's frame counter disagrees with the episode length ("the playback counter reads `62 / 8`"),
        and later episodes in the same video file render with frozen footage
      - 'Separately reported: with `--dataset.num_episodes=1`, pressing the left arrow to re-record makes the program
        stop after the reset instead of re-recording the episode'
    cause:
      '`clear_episode_buffer()` deleted staging frames only for `meta.image_keys`, which is empty when cameras are
      stored as `dtype="video"` (the default), so the discarded take''s PNG frames stayed in the staging directory that
      the re-recorded take reuses and were encoded into its video.'
    fix:
      'Fixed on lerobot `main` by PR #3683 (merged 2026-07-27), which makes `clear_episode_buffer()` delete staging
      frames for all `camera_keys`; upgrade past that commit, or set `streaming_encoding=true` (v0.4.4+) which avoids
      the PNG staging path.'
    source:
      - ref: https://github.com/huggingface/lerobot/issues/4109
        retrieved: 2026-09-09
        note: issue body — repro, measured impact, root cause
      - ref: https://github.com/huggingface/lerobot/issues/4109#issuecomment-5116804421
        retrieved: 2026-09-09
        note: comment 1 by nevertmr (CONTRIBUTOR) — the reporter, verifying the fix on main
      - ref: https://github.com/huggingface/lerobot/issues/1372
        retrieved: 2026-09-09
        note: issue body — the re-record-terminates variant
      - ref: https://github.com/huggingface/lerobot/issues/1372#issuecomment-3013628773
        retrieved: 2026-09-09
        note: comment 1 by cverrier (CONTRIBUTOR) — the reporter, closing it as fixed
    unverified: false
    scope: lerobot-software
    frequency: 2
    confidence: confirmed
    review_notes: >-
      Cause: "`DatasetWriter.clear_episode_buffer()` deletes staging only for `meta.image_keys`, which is empty when
      cameras are stored as video (`src/lerobot/datasets/dataset_writer.py:582` on 1427d35e)." and "The re-recorded take
      reuses the same episode index and staging directory, and encoding picks up the whole directory, and the discarded
      take's frames end up inside the new episode's video, so parquet `length` and the encoded video disagree." —
      https://github.com/huggingface/lerobot/issues/4109 (issue body, nevertmr, CONTRIBUTOR). Fix, confirmed by the
      reporter: "this is fixed on `main` by #3683 (merged 2026-07-27) — `clear_episode_buffer()` now deletes staging
      frames for all `camera_keys`, so discarded takes no longer leak into the re-recorded episode's video. I verified
      against current `main` with a controlled reproduction ... on current `main` the output is clean." —
      https://github.com/huggingface/lerobot/issues/4109#issuecomment-5116804421 (comment 1). Affected range from the
      body: "Present from v0.4.3 through current `main` (1427d35e). `streaming_encoding=true` (v0.4.4+) avoids the PNG
      staging path, but it is not the default." HIGH VALUE DESPITE LOW FREQUENCY: silent dataset corruption measured on
      real SO-101 collections — "225 episodes (33.9 %) carry appended frames from discarded takes" out of 664 — and a
      builder who never re-reads their videos will not notice. SECOND THREAD IS A DISTINCT BUG, bundled by the cluster:
      #1372 is the re-record flow terminating early ("After the environment has been reset, the program terminates")
      with `--dataset.num_episodes=1`, closed by its own reporter — "Closing this as commit
