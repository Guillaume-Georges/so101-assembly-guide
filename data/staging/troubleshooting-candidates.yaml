  - id: find-port-and-leader-follower-port-mixup
    slug: find-port-usb-not-removed-port-mixup
    title: 'lerobot-find-port: the interface will not be detected'
    aliases:
      - Remember to remove the usb, otherwise the interface will not be detected
      - Remove the usb cable from your MotorsBus and press Enter when done
      - lerobot-find-port does not detect the interface unless the USB cable is removed
      - leader and follower ports swapped
      - which port is ttyACM0 and which is ttyACM1
    symptoms:
      - lerobot-find-port lists both ports ('/dev/ttyACM0', '/dev/ttyACM1') and asks you to remove the usb cable from
        your MotorsBus, and the interface is not detected if the cable is left plugged in
      - Which arm lands on ttyACM0 depends on plug order, so the leader and follower ports end up the wrong way round in
        later commands
    cause:
      The Seeed wiki states that the interface is not detected unless the USB cable is actually removed when
      lerobot-find-port asks, and that the first USB device plugged in is assigned ttyACM0 (follower) while the second
      is assigned ttyACM1 (leader).
    fix:
      Unplug that arm's USB cable when lerobot-find-port prompts and press Enter, reconnect it afterwards, and check
      which port is mapped to leader and which to follower before running any further command.
