    frequency: 2
    confidence: open
    review_notes: >-
      Cause: "it's because the gamepad teleop sends actions in end-effector space but the so101_follower robot config
      only takes actions in joint-space. Currently there's no equivalent class for end-effector control of the SO101 but
      there is one for the SO100." — https://github.com/huggingface/lerobot/issues/1433#issuecomment-3153301243 (comment
      6, EricPedley, NONE); same mechanism restated by a CONTRIBUTOR in #3057: "Some teleoperators that control an end
      effector, e.g., `keyboard_ee` or `gamepad`, raise the `StopIteration` error when I want to control the SO101 arm
