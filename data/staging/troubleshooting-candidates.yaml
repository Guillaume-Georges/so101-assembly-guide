    scope: lerobot-software
    frequency: 1
    confidence: confirmed
    review_notes: >-
      Cause, issue body (reporter Ryu-Yang, NONE, lerobot 0.4.2): "When installing a third-party package (e.g. robot or
      teleoperator) in editable mode via `pip install -e .`, the package name is automatically wrapped with a special
      prefix `__editable___` and suffix `_finder` due to PEP 660. This causes existing code that relies on prefix-based
      package name matching to fail." — https://github.com/huggingface/lerobot/issues/2460 (issue body). Fix: "Fixed in:
      https://github.com/huggingface/lerobot/pull/2687" —
