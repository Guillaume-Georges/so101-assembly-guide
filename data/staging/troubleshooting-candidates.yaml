    title: 'VLA-JEPA: hard-coded last-layer cond tap reads untrained token positions when freeze_qwen=True'
    aliases:
      - Our first symptom was a train/held-out gap that looked exactly like overfitting
      - 'freeze_qwen=True: the action-head conditioning is read from the <|embodied_action|> positions at the last
        decoder layer'
    symptoms:
      - Fine-tuning `lerobot/VLA-JEPA-Pretrain` with `freeze_qwen=True` and `enable_world_model=False` onto a 2-camera
        SO-101 tabletop arm "trains to completion with nothing in the config, the logs, or the metrics indicating
        anything is off"
      - Held-out aim reaches only "29%" of the commanded motion the grasp needs against an otherwise identical layer-27
        control, versus "71%" after retraining the action head on a layer-3 image-token tap
      - '"a train-vs-held-out gap we had spent weeks attributing to overfitting"'
    cause:
      "Per the reporter: VLAJEPAModel._qwen_last_decoder_hidden hard-codes the action head's conditioning tap to the
      last decoder layer at the <|embodied_action|> token positions, and those positions are learned readouts that
      freeze_qwen=True pins to whatever the source checkpoint's domain taught them, with neither the layer index nor the
      position set exposed in VLAJEPAConfig."
    fix: No confirmed fix in the public record as of 2026-09-09.
    source:
      - ref: https://github.com/huggingface/lerobot/issues/4414
