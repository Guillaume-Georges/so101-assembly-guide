      'No confirmed fix in the public record as of 2026-09-09: one builder reported driving the follower with a gamepad
      instead and re-writing its key mapping, saying get_teleop_events() has to be written by hand, and PR #3086 is
      named as a possible fix by a commenter whom nobody confirms.'
