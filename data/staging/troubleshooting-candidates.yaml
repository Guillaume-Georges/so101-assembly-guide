      (https://github.com/huggingface/lerobot/issues/1819#issuecomment-3764035153, comment 8); #2952''s traceback gives
      the same string with the class named SOLeader (kept as the first alias). SPLIT APPLIED: the extractor mixed two
      unrelated bugs into one cause and one fix. The urdf_path AttributeError from #2431 is now its own entry
      (hil-serl-urdf-path-missing) and #2431 is no longer cited here; frequency drops 4 -> 3 (#1819, #2952, #1387).
      Cause, quoted: "`control_mode` is never read by the RL pipeline at all. `HILSerlProcessorConfig` parses it
      (`envs/configs.py:294`), but `grep -rn control_mode src/lerobot/rl/ src/lerobot/processor/hil_processor.py` comes
      back empty... The action pipeline in `gym_manipulator.py` (around line 487) unconditionally adds
      `AddTeleopEventsAsInfoStep`, whose `__post_init__` raises the `TypeError` reported above for `SOLeader`. Same
      applies to `mode: "record"`... Even if the check were bypassed, `InterventionActionProcessorStep` builds the
      stored action from `teleop_action.get("delta_x", 0.0)`, while `SOLeader.get_action()` returns joint positions
      keyed `{motor}.pos`. Every intervention would be stored as (0, 0, 0)"
      (https://github.com/huggingface/lerobot/issues/2952#issuecomment-5159807472, comment 3, CONTRIBUTOR). Workaround
      quoted verbatim:
      "在25年12月时期的lerobot库应该不行，我当时是用到手柄来控制的从臂，重新写了手柄的键位映射。...get_teleop_events()这个方法需要自己写一下，你可以参考遥操作设备里面gamepad相关的写法。"
      (https://github.com/huggingface/lerobot/issues/1819#issuecomment-3802922497, comment 11) - in the Dec-2025 lerobot
      the leader did not work, that builder drove the follower with a gamepad and re-wrote its key mapping, and says
      get_teleop_events() must be written by hand. Proposed only: "For Leader to teleop, PR #3086 should solve your
      problem. However, I''m running into a different training issue when using position control (teleop)... I observed
      that the policy output is always near 0."
      (https://github.com/huggingface/lerobot/issues/2952#issuecomment-4219753700, comment 2). Symptom 2 traces to
      #1819''s issue body ("但是感觉min和max的差距很小" - the min/max gap feels very small) and to #1387''s body, quoted verbatim
      as the alias "the ee limit is very small and can''t used in human intervention". #1387 comment 2 proposes a patch
      to so100_follower_end_effector.send_action that nobody confirms. OFF-PLATFORM LEADS, not citable and not used: a
      WeChat number posted in https://github.com/huggingface/lerobot/issues/1819#issuecomment-3708728196 (comment 5,
      "加我微信18451316007") and, in the thread now split off, a WeChat handle in
      https://github.com/huggingface/lerobot/issues/2431#issuecomment-3525061696 (comment 6, "for further discussion,
      you may dm me with wechat DamingW0216"). #1819 is mostly Chinese-language. #3330 carries this symptom per the
      cluster note but belongs to another batch and is not cited. related_steps/related_parts empty: software-only.'
  - id: opencv-camera-backend-selection-fails
    slug: opencv-camera-backend-selection-fails
    title: OpenCV camera connection fails on Windows due to default backend
    aliases:
      - Failed to open OpenCVCamera(0).Run python -m lerobot.find_cameras opencv to find available cameras.
      - 'ioctl(VIDIOC_QBUF): Bad file descriptor'
      - Timed out waiting for frame from camera OpenCVCamera(/dev/video0) after 1000 ms
      - OpenCVCameraConfig settings fail under backend=ANY on Linux; the same settings work with backend=V4L2
      - Lerobot Camera Backend Issues
      - Is it possible to get USB camera working with SO101 arm through WSL Ubuntu?
      - backend is generally available but can't be used to capture by index
    symptoms:
      - lerobot-find-cameras lists the camera with the right size but then fails to connect or capture, while a plain
        cv2.VideoCapture script reads frames from the same device
      - On Windows the listed backend is MSMF or DSHOW and connection fails; with CAP_DSHOW forced only one camera works
        and a second camera returns a broken still
      - On Linux and WSL the listed backend is FFMPEG and every read returns status=False until the read times out after
        1000 ms
      - Recording that worked the night before fails the next morning with failed to set fourcc=MJPG and failed to set
        capture_width=640
      - On WSL, forcing V4L2 and fourcc MJPG produces a saved image but the log still fills with Corrupt JPEG data lines
    cause:
      lerobot opens the camera with OpenCV's default backend and the backend OpenCV then picks cannot capture from the
      device - MSMF or DSHOW on Windows, FFMPEG on one builder's Linux/WSL setup with OpenCV 4.13 where 4.12 picked V4L2
      - while the same device works when the backend is named explicitly.
    fix:
      'Force the backend instead of leaving it at the default: cv2.CAP_MSMF or cv2.CAP_DSHOW on Windows, each confirmed
      first-hand by the builder who tried it, and cv2.CAP_V4L2 on Linux, with a maintainer closing #1368 on PR #2945
      making the backend configurable from the CLI while stating that lerobot-find-cameras itself still takes the
      platform default.'
    source:
      - ref: https://github.com/huggingface/lerobot/issues/1368
        retrieved: 2026-09-09
        note: issue body by myanvoos (NONE), the reporter
      - ref: https://github.com/huggingface/lerobot/issues/1368#issuecomment-3009796477
        retrieved: 2026-09-09
        note: comment 1 by ashutoshsingh0223 (NONE)
      - ref: https://github.com/huggingface/lerobot/issues/1368#issuecomment-3101560528
        retrieved: 2026-09-09
        note: comment 3 by dgouyette (NONE)
      - ref: https://github.com/huggingface/lerobot/issues/1368#issuecomment-4041581730
        retrieved: 2026-09-09
        note: comment 7 by imstevenpmwork (COLLABORATOR)
      - ref: https://github.com/huggingface/lerobot/issues/1368#issuecomment-4414112817
        retrieved: 2026-09-09
        note: comment 8 by rcpeters (NONE)
      - ref: https://discuss.huggingface.co/t/lerobot-camera-backend-issues/173200
        retrieved: 2026-09-09
        note:
          'forum topic: post 1 by CursedRock17 (forced cv2.CAP_V4L2, recording worked) and post 2 by lmbsh (pinning opencv
          to 4.12.0.88)'
      - ref: https://discuss.huggingface.co/t/is-it-possible-to-get-usb-camera-working-with-so101-arm-through-wsl-ubuntu/178337
        retrieved: 2026-09-09
        note:
          'forum topic: post 1 by InukaSilva (symptom), post 8 by John6666 (OpenCV 4.13 vs 4.12 backend selection), post 9
          by InukaSilva (partial result with V4L2 + MJPG)'
    unverified: false
    scope: lerobot-software
    frequency: 3
    confidence: confirmed
    review_notes:
      'VERIFIED; confidence confirmed is re-anchored by this pass to the Windows branch only. Reporter''s own
      confirmation, in the issue body: "I managed to resolve this issue locally by making a one-line change to
      `lerobot/common/cameras/opencv/camera_opencv.py`. In the `connect` method, changing: `self.videocapture =
      cv2.VideoCapture(self.index_or_path, self.backend)` to the hardcoded: `self.videocapture =
      cv2.VideoCapture(self.index_or_path, cv2.CAP_MSMF)` forces OpenCV to use the Media Foundation backend, which then
      works." (https://github.com/huggingface/lerobot/issues/1368, issue body), with the error string in the same body:
      "Failed to open OpenCVCamera(0).Run python -m lerobot.find_cameras opencv to find available cameras." Platform
      variation, first-hand: "For me `cv2.CAP_DSHOW` is the one that worked on windows. Not `cv2.CAP_MSMF`." (comment 1)
      and "I had to switch to `cv2.CAP_DSHOW` And using cv2.CAP_DSHOW it works but only for 1 camera. When i use 2
      camera recording doesn''t work and i have the following error : backend is generally available but can''t be used
      to capture by index." (https://github.com/huggingface/lerobot/issues/1368#issuecomment-3101560528, comment 3).
      Linux, first-hand: "My temporary solution is force this line to utilize Video4Linux2 Old: self.videocapture =
      cv2.VideoCapture(self.index_or_path, self.backend) New: self.videocapture = cv2.VideoCapture(self.index_or_path,
      cv2.CAP_V4L2) The actually camera utility and rerecording worked." plus the reply "After pinning all opencv
      dependencies to 4.12.0.88 I don''t encounter your described error anymore."
      (https://discuss.huggingface.co/t/lerobot-camera-backend-issues/173200, posts 1 and 2; post 1 also carries the
      fourcc/width error strings quoted as symptom 4). WSL BRANCH DOWNGRADED TO A SYMPTOM BY THIS PASS, because the
      extractor wrote "each confirmed by the builder who tried it" and the WSL confirmation is hedged: "within the
      lerobot_find_cameras.py file, I set fourcc=\"MJPG\" and had my opencv libraries 4.12. this seemed to work sort of?
      ... Additionally the image it saves seems to be correct, but clearly there is some data that is corrupt in that
      image."
      (https://discuss.huggingface.co/t/is-it-possible-to-get-usb-camera-working-with-so101-arm-through-wsl-ubuntu/178337,
      post 9), followed by many "Corrupt JPEG data" lines - so MJPG + 4.12 is not asserted as a fix, only as the state
      that got one image saved. The 4.13/4.12 boundary is attributed, not asserted: "The downgrade result is useful
      evidence rather than just a workaround: OpenCV 4.13 -> CAP_ANY selected FFMPEG  OpenCV 4.12 -> CAP_ANY selected
      V4L2" and, in the same post, "I would not call it a confirmed OpenCV regression from this alone... but the version
      boundary is worth recording." (same topic, post 8). DISPUTED MAINTAINER CLOSURE, recorded and not written as
      solved: "I''m closing this issue as we made the backend configurable from the CLI in:
      https://github.com/huggingface/lerobot/pull/2945 ... Mind; however, that the `find_cameras` implementation (which
      is invoked by `lerobot-find-cameras` doesn''t specify any backend and will pick up the default in your platform."
      (https://github.com/huggingface/lerobot/issues/1368#issuecomment-4041581730, comment 7, COLLABORATOR), answered by
      "I don''t understand why you would close this ticket with a comment pointing out lerobot-find-cameras doesn''t
      work? Anyone following a tutorial with lerobot-find-camera is bound to get stuck." (comment 8). Both forum topics
      are public Discourse pages with no login, so citable; post 2 of 178337 and posts 4 and 10 suggest the LeRobot
      Discord, which is not citable and is not used. lerobot#3198 ("OpenCVCameraConfig settings fail under backend=ANY
      on Linux") is named by the forum posts and kept only as an alias - it is not in this batch''s cluster, so it is
      not cited; a reviewer may want to add it.'
  - id: printed-part-too-tight-for-motor
    slug: printed-part-too-tight-for-motor
    title: Cannot insert my servo motor to the base printed in Bambu Lab P1S
    aliases:
      - It's just around 0.5 mm too tight
      - even with a huge force, it got stuck
      - Base Idle Clap tolerances too tight
      - Parts require excessive force during assembly, is it a tolerance issues?
      - all the connection points require excessive force to assemble
      - I had some trouble fitting the base with the motor 1 blocker (Base_08q-5.STL). The most difficult part for me
        was the Wrist_Roll_Pitch_08i-1.STL
    symptoms:
      - The servo will not go into the base opening even with heavy force, and has to be pulled back out with a tool,
        while the printed gauge Gauge_0 fits
      - The second printed part will not fit over the base even without the motor in place
      - The base clamp grips the extra servo horn on motor 1 instead of clearing it, adding friction to the joint
      - Every mating surface needs excessive force on an Anycubic Kobra S1 with PLA+, despite good-looking print quality
      - 'Another builder on a P1S reports the opposite check result: "Testing with the Gauge Zero also fails."'
      - A reporter measures the base model opening at 24.70 x 32.90 mm against an STS3215 specification of 24.72 x 35
        mm, while the print file's author reprints the same file on a P1P and both Waveshare and Feetech servos fit
    cause:
      "The sources disagree: one reporter measures the printed base model itself as about 2 mm shorter than the servo's
      specified height, while the author of the Bambu print file reprinted it and found both servo brands fit (sometimes
      needing a lot of force), and other builders attribute the tight fit to printer and filament dimensional error."
    fix:
      Builders got the parts to fit by removing material - sanding the corners that rub or carving clearance into the
      clamp - or by scaling the parts to 100.10%, while slicer compensation (XY hole/contour compensation, small-area
      flow compensation, dry filament) and printing the upstream gauges first are suggested but unconfirmed.
    related_steps:
      - F-001
      - F-011
      - F-012
      - F-050
    related_parts:
      - base-so101
      - base-motor-holder-so101
      - wrist-roll-pitch-so101
      - servo-sts3215-c001-345
