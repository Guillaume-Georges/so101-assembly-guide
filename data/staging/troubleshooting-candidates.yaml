    scope: lerobot-software
    frequency: 1
    confidence: open
    review_notes:
      'VERIFIED against corpus/lerobot/4414.json, no changes. Cause, issue body: "**The tap is hard-coded to the
      last decoder layer, at the `<|embodied_action|>` token positions.** `VLAJEPAModel._qwen_last_decoder_hidden`
      (`src/lerobot/policies/vla_jepa/modeling_vla_jepa.py:154-169`) hooks
      `self.qwen.model.model.language_model.layers[-1]` ... Neither the layer index nor the position set is exposed in
      `VLAJEPAConfig`." and "`config.freeze_qwen` then does `self.qwen.requires_grad_(False)`
      (`modeling_vla_jepa.py:134`), so on a new embodiment those readouts cannot re-adapt." —
      https://github.com/huggingface/lerobot/issues/4414 (issue body; Environment block: main @ 59ab28620f3f, base
