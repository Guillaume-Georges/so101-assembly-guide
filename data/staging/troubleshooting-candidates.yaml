  - id: jetson-arm64-wrong-actions-or-no-gpu
    slug: jetson-torchcodec-unavailable-cpu-fallback
    title: "'torchcodec' is not available in your platform, falling back to 'pyav' as a default decoder"
    aliases:
      - 'On jetson AGX Orin no gpu used to train policy : We recommend that you migrate to TorchCodec'
      - SmolVLA Inference on Jetson Orin (ARM64) Produces Incorrect Results Despite Same Model Working on x86_64
      - WARNING:root:No accelerated backend detected. Using default cpu, this will be slow.
      - WARNING:lerobot.configs.policies:Device 'cuda' is not available. Switching to 'cpu'.
      - 'torchcodec: Not available (cannot be installed due to ARM64 / glibc constraints)'
    symptoms:
      - On a Jetson (AGX/Orin, aarch64), `lerobot-train --policy.device=cuda` logs "'torchcodec' is not available in
        your platform, falling back to 'pyav' as a default decoder" and then "Device 'cuda' is not available. Switching
        to 'cpu'", so training runs on CPU
      - '`lerobot-info` on the Jetson reports "Is PyTorch built with CUDA support?: False" even though JetPack and CUDA
        are installed'
      - 'Separately reported: the same SmolVLA checkpoint that completes the task on an x86_64 laptop "executes
        seemingly random/unexpected movements" on a Jetson Orin with no runtime error'
    cause:
      No package index ships a Jetson wheel of torch/torchcodec built with CUDA for the Python version LeRobot
      requires, so `pip install` silently lands CPU-only torch and torchcodec is skipped by its dependency marker on
      Linux aarch64.
    fix:
      "For the CPU-fallback half only, use a Jetson build where torch and torchcodec are compiled with CUDA for the
      container's Python — a CONTRIBUTOR published a from-source build script and a prebuilt image
      (`ghcr.io/ravediamond/lerobot-jetson`) and reports `torch.cuda.is_available()` -> `True` on a real Orin NX — while
      no fix is established in the public record for the wrong-actions symptom reported in #3636."
    source:
      - ref: https://github.com/huggingface/lerobot/issues/2363
