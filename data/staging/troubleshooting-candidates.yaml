  - id: rtc-inference-delay-kwarg-on-act
    slug: rtc-inference-delay-unexpected-kwarg
    title: predict_action_chunk() got an unexpected keyword argument 'inference_delay'
    aliases:
      - RTC inference engine crashes with TypeError on ACT (and other non-**kwargs) policies
      - "RTC inference error (n/10): predict_action_chunk() got an unexpected keyword argument 'inference_delay'"
    symptoms:
      - '`lerobot-rollout --strategy.type=base --inference.type=rtc` with a trained ACT checkpoint on
        `--robot.type=so101_follower` logs "~5 seconds of repeated `RTC inference error (n/10): predict_action_chunk()
        got an unexpected keyword argument ''inference_delay''` log lines before the process exits"'
      - The TypeError is raised inside a background RTC thread, swallowed by a generic handler and retried with a 0.5 s
        backoff up to 10 times, so there is no immediate, obvious failure
    cause:
      RTCInferenceEngine unconditionally calls predict_action_chunk() with the RTC-only keywords inference_delay and
      prev_chunk_left_over, which ACT and other policies whose concrete implementations declare no **kwargs catch-all
      reject outright.
    fix: 'Update to a lerobot version that includes PR #4228, which a LeRobot collaborator states solved it.'
    source:
      - ref: https://github.com/huggingface/lerobot/issues/3997
        retrieved: 2026-09-09
        note: issue body
      - ref: https://github.com/huggingface/lerobot/issues/3997#issuecomment-5145445790
        retrieved: 2026-09-09
        note: comment 1 by imstevenpmwork (COLLABORATOR)
    unverified: false
    scope: lerobot-software
    frequency: 1
    confidence: confirmed
    review_notes:
      'VERIFIED against corpus/lerobot/3997.json, no changes. Cause, issue body: "`lerobot-rollout
      --inference.type=rtc` fails at runtime for `ACTPolicy` (and several other policy families) because
      `RTCInferenceEngine` unconditionally calls `predict_action_chunk()` with two RTC-specific keyword arguments that
      most policies'' concrete implementations do not accept." and "`inference_delay` and `prev_chunk_left_over` aren''t
      part of `ActionSelectKwargs` at all, and several concrete overrides don''t declare a `**kwargs` catch-all, so they
      reject the extra keywords outright." — https://github.com/huggingface/lerobot/issues/3997 (issue body; Environment
      block: lerobot 0.6.1, commit 3e538352ca5a3cc9dcef66eb07e130448f2c2869, "Robot: SO-101 follower arm, policy: ACT").
