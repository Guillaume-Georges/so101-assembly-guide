        retrieved: 2026-09-09
        note: comment 10 by ynaka81 (CONTRIBUTOR) — workaround no longer applies
      - ref: https://github.com/huggingface/lerobot/issues/3057
        retrieved: 2026-09-09
        note: issue body by ynaka81 (CONTRIBUTOR)
    unverified: true
