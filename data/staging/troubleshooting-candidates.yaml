      problem!" (comment 12, SangbumChoi). Port permissions: "The fix that worked for me was to chmod 666 ports: sudo
      chmod 666 /dev/ttyACM0 … I did this for the leader port as well and it worked first try." (comment 18,
      grahamstelzer) and comment 20 (DominikFilipiak: "sudo chmod 666 /dev/your-follower / sudo chmod 666
      /dev/your-leader"). Replug: "Then I unplugged the SO-101 follower arm from my computer, replugged it and ran the
      exact same script again, and everything worked." (comment 17, cverrier). THREE VERIFIER FIXES APPLIED, each
