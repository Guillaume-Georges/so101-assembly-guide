  - id: dagger-snap-back-on-resume
    slug: dagger-leader-snap-back-pause-resume
    title: 'DAGGER resume: RTC engine uses stale observation after correction, causing snap-back'
    aliases:
      - 'SO-101 DAGGER: bumpless transfer on pause (sync leader to follower pose)'
      - arm snaps toward the pre-correction position before smoothly continuing
      - the leader arm snaps back to wherever the operator was holding it
      - send_feedback() raises NotImplementedError
    symptoms:
      - After ending a correction and resuming autonomous mode, the arm snaps toward its pre-correction position before
        continuing smoothly
      - Pressing pause (F10/Space) during DAGGER leaves the follower holding position while the leader snaps back to
        wherever the operator was holding it
      - The operator has to realign the leader by hand before starting a correction, so the correction starts from a
        different pose than where the policy failed
    cause:
      On the PAUSED to AUTONOMOUS transition the RTC engine's _obs_holder still holds the pre-correction observation,
      because notify_observation() is never called during the correction, so the first action chunk after resume targets
      the pre-correction pose.
    fix:
      'Reported only: feed a fresh observation to the engine between engine.reset() and engine.resume(), the fix a
      maintainer called correct and which the still-open PR #4398 implements with a regression test.'
    source:
      - ref: https://github.com/huggingface/lerobot/issues/3747
        retrieved: 2026-09-09
        note: issue body
      - ref: https://github.com/huggingface/lerobot/issues/3747#issuecomment-4668770287
        retrieved: 2026-09-09
