  - id: multi-gpu-tensor-device-mismatch
    slug: expected-all-tensors-on-the-same-device
    title: 'RuntimeError: Expected all tensors to be on the same device, but found at least two devices, cuda:0 and cuda:1!'
    aliases:
      - '`smolvla_base training`: `Expected all tensors to be on the same device`'
      - Expected all tensors to be on the same device
      - found at least two devices, cuda:0 and cuda:1
    symptoms:
      - training `lerobot/smolvla_base` on the `lerobot/svla_so101_pickplace` dataset crashes at the first policy
        forward pass with that RuntimeError, after "Start offline training on a fixed dataset"
      - '"Same problem as u ;-; It makes cuda.is_available() struck" — a second builder reports the same crash'
    cause:
      On a machine with more than one GPU the SmolVLA modules end up spread across cuda:0 and cuda:1, which a lerobot
      contributor calls "a common pitfall when training on a multi-GPU device".
    fix:
      Hide the other GPUs — run `CUDA_VISIBLE_DEVICES=0 python train.py …` (or set `os.environ["CUDA_VISIBLE_DEVICES"] =
      "0"` at the top of `train.py`), which is both the reporter's own workaround and a lerobot contributor's quick fix.
    source:
