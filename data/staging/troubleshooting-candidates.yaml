  - id: training-memory-crash
    slug: training-std-bad-alloc-dataloader-worker
    title: terminate called after throwing an instance of 'std::bad_alloc'
    aliases:
      - 'what(): std::bad_alloc'
      - 'RuntimeError: DataLoader worker (pid(s) 2631794) exited unexpectedly'
      - 'RuntimeError: DataLoader worker (pid 2633408) is killed by signal: Aborted.'
      - 'RuntimeError: CUDA error: device-side assert triggered'
      - std::bad_alloc / DataLoader worker exited unexpectedly during training with smolvla_base
    symptoms:
      - '`lerobot-train` with `--policy.path=lerobot/smolvla_base` aborts almost immediately with "terminate called
        after throwing an instance of ''std::bad_alloc''" and a DataLoader worker that exited unexpectedly'
      - It persists with `num_workers=1` and with smaller batch sizes, and only setting `num_workers=0` (plus commenting
        out `prefetch_factor=2`) avoids it — at a large speed cost
      - The same environment trains `diffusion_pusht` successfully, and the machine has 512 GB RAM and 2x96 GB GPUs, so
        it is not an actual memory shortage
      - 'Separately reported: smolvla training on an SO-101 dataset fails with "RuntimeError: CUDA error: device-side
        assert triggered"'
    cause:
      A version incompatibility between TorchCodec and PyTorch (the reporter describes it as an ABI instability) makes
      the video-decoding call in the DataLoader worker abort in C++ rather than raise a Python error.
    fix:
      'Match the two versions or bypass the decoder: upgrade TorchCodec (v0.8 with PyTorch 2.9, or `pip install -U
      torchcodec`), or pass `--dataset.video_backend pyav`.'
    source:
      - ref: https://github.com/huggingface/lerobot/issues/2209
        retrieved: 2026-09-09
        note: issue body
