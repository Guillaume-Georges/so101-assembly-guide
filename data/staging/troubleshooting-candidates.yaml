candidates:
  - id: camera-feature-key-mismatch-mean-is-infinity
    slug: policy-camera-key-mismatch-mean-infinity
    title:
      'AssertionError: mean is infinity. You should either initialize with stats as an argument, or use a pretrained
      model.'
    aliases:
      - mean is infinity. You should either initialize with stats as an argument or use a pretrained model
      - '`mean` is infinity. You should either initialize with `stats` as an argument, or use a pretrained model.'
      - Cannot eval policy because dataset statistics are missing
      - "AssertionError: Policy image features must match robot cameras! Received ['observation.image2',
        'observation.image', 'observation.image3'] != ['observation.images.image2', 'observation.images.image',
        'observation.images.image3']"
      - 'ValueError: Feature mismatch between dataset/environment and policy config.'
      - All image features are missing from the batch. At least one expected.
      - "KeyError: 'observation.images.left'"
      - "Error in StreamActions: 'observation.images.wrist_top'"
      - 'ValueError: Visual feature mismatch between policy and robot hardware'
      - rename_map not passed to make_policy in lerobot-record
      - --rename_map silently ignored
    symptoms:
      - lerobot-record with --policy.path loads the checkpoint, connects the camera, starts 'Recording episode 0' and
        then dies on the mean-is-infinity assertion before the first action
      - the policy expects observation.images.camera1/camera2/camera3 but the dataset keys are observation.images.top
        and observation.images.wrist
      - --rename_map is accepted on the command line but has no effect and the same feature mismatch is raised again
      - "the async policy server logs only 'Error in StreamActions: <camera key>' and the arm never moves"
      - a two-camera SO-101 cannot roll out a checkpoint fine-tuned with --policy.empty_cameras because the saved config
        expects a third or an empty_camera_0 slot
      - one maintainer attributes the identical 'mean is infinity' string on lerobot 0.3.2 to in-weights normalization
        layers removed in v0.4.0 rather than to camera keys
    cause:
      The camera/image feature keys supplied at record or inference time do not match the keys the dataset statistics
      and the policy config were built with.
    fix:
      Make the keys in --robot.cameras exactly match the keys used when the dataset was recorded, or map them onto the
      keys the policy expects with --rename_map (adding --policy.empty_cameras when the policy expects more cameras than
      the robot has).
    source:
      - ref: https://github.com/huggingface/lerobot/issues/3645
        retrieved: 2026-09-09
        note: issue body (verbatim title string; lerobot 0.3.2, --robot.type=so101_follower)
