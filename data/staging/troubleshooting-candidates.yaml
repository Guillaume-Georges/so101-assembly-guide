  - id: datasets-4-0-feature-type-list
    slug: datasets-4-feature-type-list-not-found
    title:
      "ValueError: Feature type 'List' not found. Available feature types: ['Value', 'ClassLabel', 'Translation',
      'TranslationVariableLanguages', 'LargeList', 'Sequence', 'Array2D', 'Array3D', 'Array4D', 'Array5D', 'Audio',
      'Image', 'Video', 'Pdf', 'VideoFrame']"
    aliases:
      - Feature type 'List' not found
      - issue training model
      - "TypeError: stack(): argument 'tensors' (position 1) must be tuple of Tensors, not Column"
      - "TypeError: stack(): argument 'tensors' must be tuple of Tensors"
      - 'TypeError: must be called with a dataclass type or instance'
    symptoms:
      - lerobot-train raises the error on one recorded dataset while another dataset trains fine
      - The failure started when the datasets python package moved to 4.0.0
      - 'After downgrading datasets, training instead fails with TypeError: must be called with a dataclass type or
        instance'
      - "Training fails with TypeError: stack(): argument 'tensors' (position 1) must be tuple of Tensors, not Column"
    cause:
      LeRobot did not support the List feature type introduced in datasets v4.0.0, and a dataset recorded under one
      datasets version is not readable under the other because its parquet files were written with List instead of
      Sequence.
    fix:
      Pin the datasets package below 4.0 and record and train on the same version — a LeRobot contributor's summary says
      the only consistent workaround is to collect and train with 3.6.0 (others in the thread report 3.2.0 or 3.0, and
      the Seeed wiki says datasets==2.19) — or rewrite the parquet shards with Sequence in place of List.
    source:
      - ref: https://github.com/huggingface/lerobot/issues/1538
        retrieved: 2026-09-09
        note: issue body — verbatim error string
      - ref: https://github.com/huggingface/lerobot/issues/1538#issuecomment-3091313554
        retrieved: 2026-09-09
        note: comment 3 by genemerewether (NONE)
      - ref: https://github.com/huggingface/lerobot/issues/1538#issuecomment-3290353516
        retrieved: 2026-09-09
        note: comment 16 by Ricram2 (NONE)
      - ref: https://github.com/huggingface/lerobot/issues/1538#issuecomment-3323091431
        retrieved: 2026-09-09
        note: comment 17 by jadechoghari (CONTRIBUTOR)
      - ref: https://github.com/huggingface/lerobot/issues/1538#issuecomment-3323101704
        retrieved: 2026-09-09
        note: comment 19 by jadechoghari (CONTRIBUTOR)
      - ref: https://wiki.seeedstudio.com/lerobot_so100m_new/
        retrieved: 2026-09-09
        note:
          'FAQ/training troubleshooting block, "TypeError: stack(): argument ''tensors'' must be tuple of Tensors" -> pip
          install datasets==2.19'
    unverified: false
    scope: lerobot-software
    frequency: 2
    confidence: confirmed
    review_notes:
      'KEEP, nothing to change. The restored full title is verbatim in #1538''s issue body and again inside
      comment 17. Cause, comment 17 by jadechoghari (CONTRIBUTOR): "There is an issue with the datasets 4.0.0 and
      lerobot not being compatible [...] LeRobot v0.2.0 doesn''t support the new List type added in datasets v4.0.0.
      Using v3.6 avoids that but introduces other incompatibilities, e.g. when you collected the data using 4.0.0 and
      then switched to 3.6 for training. Right now, the only consistent workaround is to collect and train with the same
      older datasets version (3.6.0) [...] For us the easiest workaround was to downgrade to 3.2.0."
      (https://github.com/huggingface/lerobot/issues/1538#issuecomment-3323091431, comment 17), and comment 19: "it
      looks like the root cause is more of a dataset creation issue, the Parquet files were written with \"List\"
      instead of \"Sequence\". I used a quick script to patch the parquet shards and rewrite them with the correct
      schema, and that resolves the errors." (comment 19). Fix corroborated by sufferers: comment 3, "this is the
      `datasets` python package not being limited to `<4.0`. After adding that version restriction, you also need to
      purge datasets downloaded when `datasets` had jumped to `4.0`" (answered "you were right! Many thanks." at comment
      4), and comment 16, "The fix was to downgrade to datasets==3.6.0 AND RECORD THE DATASET AGAIN." (comment 16). The
      wiki''s competing pin verified in corpus/wiki/seeed-so100m-new.md at lines 2929, 2934 and 2940: summary
      "`TypeError: stack(): argument ''tensors'' must be tuple of Tensors`", detail "`TypeError: stack(): argument
      ''tensors'' (position 1) must be tuple of Tensors, not Column`", remedy "`pip install datasets==2.19`". Because
      the sources disagree on the number (2.19 / 3.0 / 3.2.0 / 3.6.0, and comments 13 and 14 report 4.0.0 working fine),
      the one-sentence fix deliberately names the constraint and attributes each number; see needs_human. No step or
      part id applies.'
  - id: diffusion-policy-async-empty-tensorlist
    slug: diffusion-async-empty-tensorlist
    title: 'RuntimeError: stack expects a non-empty TensorList'
    aliases:
      - 'Async inference crashes with diffusion policy: stack expects a non-empty TensorList'
      - 'ERROR y_server.py:266 Error in StreamActions: stack expects a non-empty TensorList'
      - Diffusion policy fails with async inference on a GPU
      - assert n_obs_steps == self.config.n_obs_steps
    symptoms:
      - 'The policy server loads the diffusion model, logs inference for observation #0, then errors and never produces
        an action chunk'
      - The robot never moves and the server loops "Starting receiver"
      - An ACT policy runs correctly on the identical arm, cameras, server and network path
    cause:
      The async policy server calls DiffusionPolicy.predict_action_chunk() directly, skipping the image-key
      consolidation, the ACTION pop and the populate_queues() call that select_action() performs, so the
      observation-history queues diffusion needs (n_obs_steps, default 2) are empty when they are stacked — ACT is
      unaffected because it has no such queue.
    fix:
      'Update to a LeRobot that contains PR #3822, which a collaborator states solved it, and which moves that
      preprocessing into predict_action_chunk() as PR #3886 also does by expanding the single async frame along the
      n_obs_steps dimension.'
    source:
      - ref: https://github.com/huggingface/lerobot/issues/3445
        retrieved: 2026-09-09
        note: issue body
      - ref: https://github.com/huggingface/lerobot/issues/3445#issuecomment-5145417832
        retrieved: 2026-09-09
        note: comment 3 by imstevenpmwork (COLLABORATOR)
      - ref: https://github.com/huggingface/lerobot/issues/3861
        retrieved: 2026-09-09
        note: issue body
      - ref: https://github.com/huggingface/lerobot/issues/3861#issuecomment-4792037670
        retrieved: 2026-09-09
        note: comment 1 by Lynn-hh (NONE)
      - ref: https://github.com/huggingface/lerobot/issues/3861#issuecomment-4827521862
        retrieved: 2026-09-09
        note: comment 2 by RahimMirani (CONTRIBUTOR), the reporter
    unverified: false
    scope: lerobot-software
    frequency: 2
    confidence: confirmed
    review_notes:
      'KEEP, nothing to change; the extractor''s upgrade of this cluster from proposed-only to confirmed is
      CORRECT. Cause, #3445 issue body: "`predict_action_chunk()` crashes with `RuntimeError: stack expects a non-empty
      TensorList` when called directly by the async inference `policy_server`. The method was designed as a subroutine
      of `select_action()` and relies on preprocessing that `select_action()` performs — but the async server bypasses
      `select_action()` entirely." (https://github.com/huggingface/lerobot/issues/3445, issue body), refined in #3861
      comment 1: "the async policy server serves observations one at a time and calls `predict_action_chunk` directly,
      but Diffusion Policy requires `n_obs_steps` (default 2) stacked observations. ACT works because its `n_obs_steps
      == 1`." (https://github.com/huggingface/lerobot/issues/3861#issuecomment-4792037670, comment 1). Fix, #3445
      comment 3 by imstevenpmwork (COLLABORATOR): "Sovled in https://github.com/huggingface/lerobot/pull/3822" (comment
      3), plus reporter validation in #3861 comment 2 by RahimMirani (CONTRIBUTOR, the thread author): "The PR expands
      the single async frame along an `n_obs_steps` temporal dimension inside `predict_action_chunk()` [...] Validated
      end-to-end on the original setup (RunPod RTX A4000 server, `policy_device=cuda`; Raspberry Pi 5 SO-101 client,
      scene + wrist cameras, async over TCP). Before the fix the server crashed at observation #0; after the fix it runs
      diffusion inference continuously" (https://github.com/huggingface/lerobot/issues/3861#issuecomment-4827521862,
      comment 2). Every alias verified verbatim, including the server log line in #3861''s body and the assertion in
      comment 1. Excluded source verified: #3445 comment 2 by rylinjames (NONE) is advice mixed with a third-party-repo
      pitch plus a Discord handle and an e-mail address; not cited. Note for the CUDA/CPU entry in this batch: the
