  - id: editable-install-config-ignored
    slug: editable-install-local-config-ignored
    title: local modifications to configuration files are ignored during runtime
    aliases:
      - Instructions should use editable mode (-e) to prevent configuration inconsistencies
      - The system ignores local changes and uses the default configurations from the installed package
      - "serial.serialutil.SerialException: could not open port '/dev/tty.usbmodem585A0076891'"
    symptoms:
      - Edits to a LeRobot configuration file in the cloned checkout have no effect when a script is run; the script
        keeps using the default values
      - '`control_robot.py --robot.type=so101 --control.type=calibrate` still opens the old port after the port was
        changed in the config file'
    cause:
      '`pip install ".[feetech]"` (no `-e`) copies the package into site-packages, so the scripts run the installed
      copy and never see edits made in the working directory.'
