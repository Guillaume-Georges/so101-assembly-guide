  - id: magnitude-exceeds-2047
    slug: calibrate-magnitude-exceeds-2047
    title: 'ValueError: Magnitude 2114 exceeds 2047 (max for sign_bit_index=11)'
    aliases:
      - 'ValueError: Magnitude 2073 exceeds 2047 (max for sign_bit_index=11)'
      - 'ValueError: Magnitude 31272 exceeds 2047 (max for sign_bit_index=11)'
      - Magnitude 30841 exceeds 2047 (max for sign_bit_index=11)
      - 'calibration failed : ValueError: Magnitude 2114 exceeds 2047'
      - Trouble Calibrating the Leader Arm
      - "so101 wrist_roll calibration broken in new version: leader/follower zero points don't correspond"
      - set_half_turn_homings
    symptoms:
      - lerobot-calibrate dies in set_half_turn_homings while writing Homing_Offset, right after the 'move to the middle
        of its range' prompt
      - the magnitude in the message differs per arm and per motor (2114, 2073, 31272, 30841)
      - it happens on the leader while the follower calibrates fine, or only on wrist_roll, or only on wrist_flex
      - it appeared after upgrading one servo's firmware
      - even when calibration succeeds, leader and follower wrist_roll must be turned to different physical positions to
        reach raw 2048, so teleoperation of that joint is wrong
    cause:
      The servo's encoder zero is far from the 2048 mid-point - a collaborator attributes it to an assembly error, the
      servos not being assembled at their zero position, which is hard to tell on Feetech servos - so the homing offset
      LeRobot writes exceeds the register's 11-bit magnitude.
    fix:
      With every joint held in the middle of its range, zero the encoders in place from the Feetech debug tool
      (Programming tab, Offset button), then re-run lerobot-calibrate.
