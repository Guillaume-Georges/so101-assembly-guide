  - id: end-effector-teleop-stopiteration
    slug: teleoperate-end-effector-stopiteration
    title: StopIteration
    aliases:
      - keyboard_ee / gamepad teleoperate StopIteration so101
      - StopIteration Exception in Teleoperate
      - Some teleoperators that control an end effector don't work
      - model = next(iter(models)) StopIteration
      - so101_follower gamepad teleop quits immediately
    symptoms:
      - '`lerobot-teleoperate --robot.type=so101_follower --teleop.type=gamepad` (or `--teleop.type=keyboard_ee`) prints
        the gamepad controls, connects, then immediately disconnects and exits with a bare `StopIteration` from
        `motors_bus.py` `sync_write`'
      - 'The arm never moves even though the gamepad is detected ("Initialized gamepad: ...") and calibration and
        motor-ID setup both worked'
      - Same traceback with a PS5 pad, a Stadia controller and a Logitech RumblePad, and with `keyboard_ee`
    cause:
      The gamepad and `keyboard_ee` teleoperators emit end-effector-space actions while the `so101_follower` robot
      config accepts only joint-space actions, so the action dict has no `.pos` keys and `sync_write` iterates an empty
      model set.
