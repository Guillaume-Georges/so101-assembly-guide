# troubleshooting.yaml — assembly and motor-setup issues, plus calibration behaviour mistaken for an assembly fault.
# Schema: data/schema/troubleshooting.json. Candidates await review in data/staging/ (never read by the build).
- id: setup-motors-no-response
  slug: setup-motors-error-check-cables
  title: Error while setting a motor ID (setup-motors)
  aliases:
    - motor not found
    - lerobot-setup-motors fails
    - "RuntimeError: Motor 'gripper' (model 'sts3215') was not found. Make sure it is connected."
    - Motor 'gripper' was not found, Make sure it is connected
    - "RuntimeError: Motor 'shoulder_lift' (model 'sts3215') was not found. Make sure it is connected."
    - 'Error occurred during motor configuration: No motors detected. Please ensure you have one motor connected.'
    - "RuntimeError: FeetechMotorsBus motor check failed on port '/dev/ttyACM0': Missing motor IDs"
    - Missing motor IDs
    - Cannot set up servo sts3215
    - COMM_RX_TIMEOUT (-6)
    - lerobot-setup-motors fails to detect any STS3215 servo motors
    - the power supply cable might disconnect as you manipulate the board
  symptoms:
    - The setup script errors at "Connect the controller board to the ... motor only and press enter"
    - 'lerobot-setup-motors stops with "Motor ''<joint>'' (model ''sts3215'') was not found. Make sure it is connected.",
      or the following lerobot-calibrate reports ''Missing motor IDs'' for exactly the motors that failed to be set'
    - The board's LED is on and the port opens, but every motor returns COMM_RX_TIMEOUT (-6) at every baudrate and every
      ID
    - Two motors carry the same ID, so one expected ID is missing and the whole bus is intermittent
    - The controller board reaches the computer through a USB hub and no motor answers until it is plugged in directly
    - A mains adapter over-delivering (16 V measured on a 12 V adapter) puts the servos into protection mode so they
      never answer
    - The power supply cable disconnects while the board is handled between the per-motor steps
    - '"[RxPacketError] Input voltage error!" appears before the not-found message: a 12 V supply on 7.4 V motors, see
      power-supply-5v-or-12v-input-voltage-error'
  cause:
    'A cable is not seated (power supply, USB to the board, or the 3-pin cable board-to-motor, including a power lead
    that came loose while the board was handled between motors); on a Waveshare board the jumpers are not on the B
    (USB) channel; or two motors already carry the same ID, so one expected ID never answers and the bus is
    intermittent.'
  fix:
    Check power, USB and the 3-pin cable at every step; set both Waveshare jumpers to B; connect only the one motor
    being configured, not yet daisy-chained; if a motor is still not found, scan the bus for a duplicate ID
    (FeetechMotorsBus.scan_port across all baudrates), then isolate each motor and rerun setup.
  related_steps:
    - F-002
    - L-002
  related_parts:
    - motor-control-board
    - servo-cable-3pin
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#2-set-the-motors-ids-and-baudrates
      note: Troubleshooting details block
    - ref: https://github.com/huggingface/lerobot/issues/3211
      retrieved: '2026-09-09'
      note: issue title and body ('Missing motor IDs' for ids 1 and 6)
    - ref: https://github.com/huggingface/lerobot/issues/3211#issuecomment-4582371577
      retrieved: '2026-09-09'
      note: 'comment 3 by jonirajala (NONE): duplicate motor ID diagnosis, scan_port check, and fix'
    - ref: https://github.com/huggingface/lerobot/issues/3211#issuecomment-5145497133
      retrieved: '2026-09-09'
      note: 'comment 5 by imstevenpmwork (COLLABORATOR): confirms the duplicate-ID cause; isolating motors and rerunning setup fixed it'
    - ref: https://github.com/huggingface/lerobot/issues/3394
      retrieved: '2026-09-09'
      note: 'issue title and body: verbatim "RuntimeError: Motor ''gripper'' (model ''sts3215'') was not found. Make sure it is connected."; all motors COMM_RX_TIMEOUT; open, unexplained'
    - ref: https://github.com/huggingface/lerobot/issues/3394#issuecomment-4591226117
      retrieved: '2026-09-09'
      note: 'comment 2 by AryanMadhavVerma (NONE): adapter overshooting 12 V to 16 V put the servos in protection mode; new adapter fixed it'
    - ref: https://github.com/huggingface/lerobot/issues/3394#issuecomment-4272690651
      retrieved: '2026-09-09'
      note: 'comment 1 by masato-ka (COLLABORATOR): test with the Feetech debug tools to separate hardware from software'
    - ref: https://github.com/huggingface/lerobot/issues/1110
      retrieved: '2026-09-09'
      note: "issue title and body: verbatim 'Error occurred during motor configuration: No motors detected. Please ensure you have one motor connected.'"
    - ref: https://github.com/huggingface/lerobot/issues/1110#issuecomment-2886246590
      retrieved: '2026-09-09'
      note: 'comment 5 by SangbumChoi (NONE, reporter): connecting the jumpers solved it'
    - ref: https://github.com/huggingface/lerobot/issues/1110#issuecomment-2886466180
      retrieved: '2026-09-09'
      note: 'comment 6 by gilspringer (NONE): the USB hub was the problem, direct connection worked'
    - ref: https://github.com/huggingface/lerobot/issues/2387
      retrieved: '2026-09-09'
      note: issue body and comment 5 (same not-found string after the input voltage error)
    - ref: https://github.com/huggingface/lerobot/issues/1244
