- id: servo-sts3215-12v-345
  name: Feetech STS3215 servo, 12V, 1:345 gear (optional follower variant)
  qty: 0
  category: servo
  assembly:
    - follower
  notes:
    'Optional replacement for the six follower servos: 30 kg.cm stall vs 16.5 kg.cm at 6V for the 7.4V part;
    needs a 12V 5A+ supply instead of 5V. Seeed lists the codes ST-3215-C018 / C047 for its Pro kit. Never for the
    leader. Qty 0 because it is not part of the standard build (D-002). Geometry: datasheet primitive 45.23 x 24.73
    x 35 mm, output shaft 12.5 mm from one end, ø6 boss (Feetech STS3215 spec A/0, 2020-03-28); the embedded vendor
    model is used for its transform only and is not redistributed.'
