- id: servo-sts3215-c001-345
  name: Feetech STS3215 servo, 7.4V, 1:345 gear (C001)
  qty: 7
  category: servo
  assembly:
    - follower
    - leader
  notes:
    Qty 7 is the two-arm build (6 follower + 1 leader). A 12V variant with 30 kg.cm stall exists for the follower
    only and needs a 12V 5A+ supply (README). Includes two horns and a 3-pin cable per the assembly texts; kit contents
    are not itemised upstream.
  source:
    - ref: upstream/SO-ARM100/README.md#sourcing-parts
      note: 'Parts For Two Arms table: product codes C001/C044/C046, 7.4V'
    - ref: upstream/lerobot/docs/source/so101.mdx#step-by-step-assembly-instructions
      note: gear-ratio table
