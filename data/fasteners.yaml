# fasteners.yaml — Schema: data/schema/fasteners.json. Quantities are counts used across the LeRobot steps, not kit contents.
- id: m2x6
  spec: M2x6 screw
  qty: 49
  assembly:
    - follower
    - leader
  where_used: Servo body to printed holders ("smallest screws"); handle to leader holder.
  notes:
    Qty = count used across the LeRobot steps (follower 24 + leader 25); kit-supplied count not stated upstream.
    Datasheet gives no tab-mounting screw; the assembly STEP models 22 "#1-42 x 3/16 in Type AB tapping screws"
    (≈ ø1.9 x 4.8 mm self-tapping) in these positions and Waveshare calls them "pointed screws". Treat as an M2-class
    self-tapping screw of 5–6 mm; exact kit part per vendor (D-001).
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-1
      note: '"4 M2x6mm screws (smallest screws)"'
    - ref: upstream/lerobot/docs/source/so101.mdx#gripper--handle
    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note: 22 x Type I Cross Recessed Fillister Head Tapping Screw ANSI B18.6.4 1-42 x 0.1875 Type AB
    - ref: https://www.mantech.co.za/Datasheets/Products/STS3215-200620A.pdf
      retrieved: '2026-09-07'
      note: 'section 9: no mounting screw specified; 10 Accessories: "No Accessories"'
- id: m3x6
  spec: M3x6 screw
  qty: 96
  assembly:
    - follower
    - leader
  where_used: Horn retaining screw (one per driven horn) and printed part to servo horn.
  notes:
    Qty = count used across the LeRobot steps (follower 50 + leader 46). Horn screw confirmed by the Feetech
    datasheet drawing ("M3X6 machine-thread screw" at the 25T output). The assembly STEP models 45 "DIN EN ISO 7045
    - M3 x 6" pan-head screws.
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-1
      note: '"Secure the top horn with a M3x6mm screw"'
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-2
    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note: PRODUCT DIN EN ISO 7045 - M3 x 6
    - ref: https://www.mantech.co.za/Datasheets/Products/STS3215-200620A.pdf
      retrieved: '2026-09-07'
      note: 'section 9 drawing: M3X6 机牙螺丝 at the output shaft'
