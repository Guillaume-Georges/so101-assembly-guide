- id: L-060
  slug: leader-holder
  title: Mount the leader holder on the wrist
  assembly: leader
  parts:
    - wrist-roll-so101
    - servo-sts3215-c046-147
  servo_slot: wrist_roll
  fasteners:
    - id: m3x6
      qty: 4
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  check: Leader holder seated on the motor 5 horn with 4 M3x6.
  instructions:
    Part identity inferred from STL file name (see part notes); confirmed only when Phase 2 places it
    in the assembly STEP.
  plain:
    do:
      - text: "Set the leader holder onto motor 5's horn and screw it on with 4 M3x6."
        from: ['source[0]', 'check', 'part:wrist-roll-so101']
    done:
      text: 'The leader holder sits on the motor 5 horn with 4 screws.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#gripper--handle
      note: 'Leader: "Mount the leader holder onto the wrist and secure it with 4 M3x6mm screws."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: Leader step 16
  unverified: true
- id: L-061
  slug: leader-handle
  title: Attach the handle to the leader holder
  assembly: leader
  parts:
    - handle-so101
    - wrist-roll-so101
  fasteners:
    - id: m2x6
      qty: 1
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  check: Handle held by 1 M2x6, driven into the tab under the holder.
  instructions:
    "The screw's hole is known from the upstream part files: Handle_SO101.step and Wrist_Roll_SO101.step are
    authored in one frame, and the handle's single M2 clearance hole (r=1.1, on a tilted face under the grip
    mount) lies on the axis of an r=0.6 pilot hole in the holder. The handle is therefore placed with the holder's
    own transform; the pose is exact relative to the holder, which is itself a recess match (approximation)."
  plain:
    do:
      - text: 'Hold the handle under the leader holder and drive one M2x6 screw through the handle into the small tab under the holder.'
        from: ['source[0]', 'check', 'instructions']
      - text: 'The grip should hang below the wrist and point back toward the base.'
        from: ['source[4]']
    done:
      text: 'The handle is held by its one screw and the grip hangs below the holder.'
      from: ['check', 'source[4]']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#gripper--handle
      note: 'Leader: "Attach the handle to the leader holder using 1 M2x6mm screw."'
    - ref: upstream/SO-ARM100/STEP/SO101/Leader_Specific/Handle_SO101.step
      note: 'r=1.1 hole from (-24.86, 0, 39.21) to (-27.26, 0, 40.0), axis (-0.951, 0, 0.309)'
    - ref: upstream/SO-ARM100/STEP/SO101/Leader_Specific/Wrist_Roll_SO101.step
      note: 'r=0.6 pilot hole from (-25.69, 0, 39.49) to (-17.75, 0, 36.91): same axis, same frame (D-005)'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Leader step 19: joystick L11 onto wrist L9'
    - ref: https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/lerobot/Leader_v2.mp4
      timestamp: 0:14
      note:
        'leader assembly animation: handle already on the holder before the gripper servo goes in; grip hangs
        below, pointing toward the base'
    - ref: https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/lerobot/Leader_v2.mp4
      timestamp: 0:24
      note: 'finished leader: handle under the wrist'
  approximation: true
- id: L-062
  slug: leader-gripper-motor
  title: Insert the gripper motor and fit its horn
  title_short: Insert the gripper motor and horn
  assembly: leader
  parts:
    - servo-sts3215-c046-147
    - wrist-roll-so101
    - servo-horn-geared
    - servo-horn-plain
  servo_slot: gripper
  fasteners:
    - id: motor-tab-screw
      qty: 4
    - id: m3x6
      qty: 1
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  check: 2 M2x6 on each side; horn retained by its M3x6; cable connects to motor 5.
  instructions:
    LeRobot says "attach a motor horn"; Waveshare fits horns at both ends. Both listed; see D-006. Part
    identity inferred from STL file name (see part notes); confirmed only when Phase 2 places it in the assembly
    STEP.
  plain:
    do:
      - text: 'Take the motor you labelled 6.'
        from: ['servo', 'F-002.check']
      - text: 'Slide it into the leader holder and fix it with 2 small self-tapping screws on each side.'
        from: ['source[0]', 'check', 'part:wrist-roll-so101']
      - text: 'Fit the geared horn with one M3x6 screw. LeRobot fits one horn; Waveshare fits one at each end, so both horns are listed (D-006).'
        from: ['source[0]', 'source[1]', 'instructions', 'check']
      - text: 'Connect motor 6 to motor 5 with its cable.'
        from: ['check', 'servo']
    done:
      text: '2 screws on each side, the horn held by its screw, and the cable goes to motor 5.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#gripper--handle
      note:
        'Leader: "Insert the gripper motor, secure it with 2 M2x6mm screws on each side, attach a motor horn using
        a M3x6mm horn screw."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Leader step 17: "the steering wheel is installed at both ends of the servo"'
  unverified: true
  cables:
    - cable-wrist-roll-to-gripper
- id: L-063
  slug: leader-trigger
  title: Attach the trigger
  assembly: leader
  parts:
    - trigger-so101
    - servo-sts3215-c046-147
  servo_slot: gripper
  fasteners:
    - id: m3x6
      qty: 4
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  check: Trigger on the geared horn with 4 M3x6; the finger loop hangs ahead of the grip.
  instructions:
    "The trigger's four M3 holes sit on the same 7 mm radius as the horn's, so it fits in four positions 90
    degrees apart; the upstream leader photo shows the loop pointing down and toward the gripper tip, and the
    3D view uses that one (approximation: the loop's rest angle is not fixed by any part)."
  plain:
    do:
      - text: 'Set the trigger onto the geared horn and screw it on with 4 M3x6.'
        from: ['source[0]', 'source[1]', 'check']
      - text: 'Turn it so the finger loop hangs down and ahead of the grip. The holes let it sit in four positions; only the upstream photo fixes which one.'
        from: ['check', 'instructions', 'source[3]']
    done:
      text: 'The trigger is on the geared horn with 4 screws and the loop hangs ahead of the grip.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#gripper--handle
      note: 'Leader: "Attach the follower trigger with 4 M3x6mm screws."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Leader step 18: onto the gear-equipped steering wheel'
    - ref: upstream/SO-ARM100/STEP/SO101/Leader_Specific/Trigger_SO101.step
      note: 'four r=1.6 holes at radius 7.0 mm about the horn face (z=0), plate 3.5 mm'
    - ref: https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/lerobot/SO101_Leader.webp
      retrieved: '2026-09-07'
      note: 'finished leader: trigger loop below and ahead of the gripper servo, in front of the grip'
  approximation: true
