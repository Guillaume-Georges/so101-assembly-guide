    identity inferred from STL file name (see part notes); confirmed only when Phase 2 places it in the assembly
    STEP.
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#gripper--handle
      note:
        'Leader: "Insert the gripper motor, secure it with 2 M2x6mm screws on each side, attach a motor horn using
        a M3x6mm horn screw."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Leader step 17: "the steering wheel is installed at both ends of the servo"'
