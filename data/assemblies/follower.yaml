- id: F-021
  slug: follower-joint2-motor
  title: Slide motor 2 in from the top and fasten
  title_short: Slide in motor 2 and fasten
  assembly: follower
  parts:
    - servo-sts3215-c001-345
    - motor-holder-so101-base
  servo_slot: shoulder_lift
  orientation_note: Inserted from the top (LeRobot).
  fasteners:
    - id: motor-tab-screw
      qty: 4
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  cables:
    - cable-shoulder-pan-to-shoulder-lift
  check:
    Motor 2 held by 4 motor-tab screws, two per side, each side one into the shoulder and one into the holder;
    its cable connects to motor 1 (either port).
  instructions:
    'The four screws are horizontal: on each side the lower one passes through the shoulder, the upper one
    through the shoulder motor holder, so they also lock the holder to the shoulder.'
  provenance:
    'Part role confirmed by placement in the upstream assembly STEP: servo 2 sits in Motor_holder_SO101_Base
    (42% enclosed), entered from above.'
  plain:
    do:
      - text: 'Take the motor you labelled 2.'
        from: ['servo', 'F-002.check']
      - text: 'Lower it into the shoulder motor holder you added in step 8, going in from the top.'
        from: ['source[0]', 'F-014.check', 'orientation_note']
      - text: 'Fix it with 4 small self-tapping screws, two on each side. On each side the lower screw goes into the shoulder and the upper one into the holder, so they also lock the holder down.'
        from: ['source[0]', 'check', 'instructions']
      - text: "Connect motor 2 to motor 1 with the 3-pin cable already on motor 2. Either of motor 1's two sockets works."
        from: ['check', 'source[1]', 'F-003.title']
    done:
      text: 'Motor 2 is held by 4 screws and a cable runs from motor 2 to motor 1.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-2
      note: '"Slide the second motor in from the top. Fasten the second motor with 4 M2x6mm screws."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Follower step 5: connect servo 1 cable to servo 2, either port'
