# follower assembly steps, in upstream (LeRobot so101.mdx) order. Schema: data/schema/assembly.json
- id: F-001
  slug: follower-clean-printed-parts
  title: Remove support material from all printed parts
  title_short: Clean the printed parts
  assembly: follower
  prep: true
  parts:
    - base-so101
    - base-motor-holder-so101
    - motor-holder-so101-base
    - motor-holder-so101-wrist
    - under-arm-so101
    - upper-arm-so101
    - rotation-pitch-so101
    - wrist-roll-pitch-so101
    - waveshare-mounting-plate-so101
    - moving-jaw-so101
    - wrist-roll-follower-so101
  tools:
    - small-screwdriver
    - putty-knife
  check: No support material remains; every screw hole with a horizontal axis is clear.
  plain:
    do:
      - text: 'Remove the support material from every printed part; a small screwdriver helps to get underneath it.'
        from: ['title', 'source[0]', 'tool:small-screwdriver']
      - text: 'Check that every screw hole running sideways (horizontal) is clear of supports.'
        from: ['check', 'source[2]']
    done:
      text: 'No support material is left and every sideways screw hole is open.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#clean-parts
    - ref: upstream/SO-ARM100/README.md#step-5-remove-supports
    - ref: upstream/SO-ARM100/README.md#step-2-set-up-the-printer
      note: '"no supports in the screw holes with horizontal axes"'
- id: F-002
  slug: follower-set-servo-ids
  title: Set motor IDs 1–6 and baud rate before assembly
  title_short: Set motor IDs and baud rate
  assembly: follower
  prep: true
  parts:
    - servo-sts3215-c001-345
    - motor-control-board
    - usb-c-cable
    - power-supply-5v
    - servo-cable-3pin
  warnings:
    - 'Set IDs now: "it will be troublesome to disassemble and assemble the servo cable after assembly" (Waveshare).'
    - 'Waveshare board: both jumpers on the B (USB) channel (LeRobot).'
    - 'Supply voltage follows the motor variant, never a single value: 5V for the standard 7.4V STS3215; 12V 5A+ only
      if the optional 12V follower motors are fitted (README, D-002).'
  check:
    Each motor answers on its own ID 1–6, bottom joint = 1, gripper = 6; leader and follower motors are labelled
    and kept apart.
  instructions:
    Connect one motor at a time to the board and run the LeRobot setup-motors command for this arm;
    the script names the joint and writes the ID. Software setup itself is out of scope here.
  plain:
    do:
      - text: 'Connect one motor at a time to the control board and run the LeRobot setup-motors command for this arm.'
        from: ['instructions']
      - text: 'The script names the joint and writes the ID into the motor: 1 is the motor in the base, 6 is the gripper.'
        from: ['instructions', 'check']
      - text: 'Write the number on each motor, and keep the leader and follower motors apart.'
        from: ['check', 'source[2]']
      - text: 'Do this before building: the cable is hard to reach once the arm is assembled.'
        from: ['warnings']
    done:
      text: 'Each motor answers on its own number, 1 to 6, and every motor is labelled.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#2-set-the-motors-ids-and-baudrates
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Servo Preprocessing: set IDs before assembling'
    - ref: https://wiki.seeedstudio.com/lerobot_so100m_new/
      retrieved: '2026-09-07'
      note: '"label them and write on each motor"'
    - ref: https://wiki.seeedstudio.com/lerobot_so100m_new/
      retrieved: '2026-09-07'
      note: '"check your motor model, gear ratio, and power supply voltage again"'
    - ref: upstream/SO-ARM100/README.md#sourcing-parts
      note: IMPORTANT note on 7.4V vs 12V servos and supplies
- id: F-003
  slug: follower-preinstall-cables
  title: Plug one 3-pin cable into each motor before building
  title_short: Plug a cable into each motor
  assembly: follower
  prep: true
  parts:
    - servo-sts3215-c001-345
    - servo-cable-3pin
  check: Every motor has one cable fitted; cables not yet daisy-chained.
  plain:
    do:
      - text: 'Plug one 3-pin cable into each motor now; the cable is hard to reach once the arm is built.'
        from: ['title', 'source[0]', 'F-002.warnings']
      - text: 'Leave the other end loose. The motors are chained together at the very end of the build.'
        from: ['check', 'F-071.title']
    done:
      text: 'Every motor has one cable hanging from it.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#clean-parts
      note: '"It is advisable to install one 3-pin cable in the motor after placing them before continuing assembly."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Follower step 1: "plug the connecting wires into the two ports of servo No. 1"'
- id: F-010
  slug: follower-joint1-horns
  title: Fit both horns on motor 1 (shoulder pan)
  title_short: Fit both horns on motor 1
  assembly: follower
  parts:
    - servo-sts3215-c001-345
    - servo-horn-geared
    - servo-horn-plain
  servo_slot: shoulder_pan
  orientation_note: Output shaft (geared horn) is the upper end of motor 1 (Waveshare).
  fasteners:
    - id: m3x6
      qty: 1
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  check: Geared horn on the output shaft, retained by its M3x6; plain horn on the bottom, no screw.
  plain:
    do:
      - text: 'Take the motor you labelled 1.'
        from: ['servo', 'F-002.check']
      - text: 'Push the geared horn onto the output shaft, the upper end of motor 1, and hold it with one M3x6 screw.'
        from: ['orientation_note', 'check', 'source[1]']
      - text: 'Push the plain horn onto the bottom end. It gets no screw.'
        from: ['check', 'source[1]']
    done:
      text: 'Geared horn on the upper end with its screw; plain horn on the bottom without one.'
      from: ['check', 'orientation_note']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-1
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Follower step 2: geared horn on the output shaft (upper end), plain horn at the bottom'
- id: F-011
  slug: follower-joint1-motor-into-base
  title: Seat motor 1 in the base
  title_short: Seat motor 1 in the base
  assembly: follower
  parts:
    - servo-sts3215-c001-345
    - base-so101
  servo_slot: shoulder_pan
  orientation_note: Two screws from the top, two from the bottom (LeRobot).
  fasteners:
    - id: motor-tab-screw
      qty: 4
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  check: 'Four motor-tab screws in: two from the top, two from the bottom. Motor 1 cable reaches the base opening.'
  instructions:
    'Placement check in the upstream assembly STEP: the lower pair enters from under the base floor and the upper
    pair from above, all four through holes in the base into the servo tabs; none of them touches the base motor
    holder, which comes next. The STEP draws the upper pair one size smaller (D-001).'
  plain:
    do:
      - text: 'Lower motor 1 into the base.'
        from: ['source[0]', 'servo']
      - text: 'Fix it with 4 small self-tapping screws: two from the top and two from underneath.'
        from: ['source[0]', 'check', 'orientation_note']
      - text: "Let the motor's cable come out through the opening in the base."
        from: ['check']
    done:
      text: '4 screws in, two from above and two from below, and the cable reaches the base opening.'
      from: ['check', 'fasteners']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-1
      note:
        '"Place the first motor into the base. Fasten the motor with 4 M2x6mm screws (smallest screws). Two from
        the top and two from the bottom."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: Follower step 1
    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note: 'placement check (pipeline hole test): 2 screws up through the base floor, 2 down from above the servo, all in Base_SO101 holes; the base motor holder has no hole at these positions'
- id: F-012
  slug: follower-joint1-motor-holder
  title: Slide the first motor holder over motor 1
  title_short: Slide the motor holder over motor 1
  assembly: follower
  parts:
    - base-motor-holder-so101
    - base-so101
  servo_slot: shoulder_pan
  fasteners:
    - id: motor-tab-screw
      qty: 2
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  check:
    Holder sits flush on the base; one motor-tab screw on each side; one motor-1 cable routed out of the base
    opening.
  instructions:
    'The two side screws are horizontal and thread through the holder into the base, 17 mm clear of the servo:
    they hold the holder, not the motor.'
  provenance:
    'Part role confirmed by placement in the upstream assembly STEP: Base_08p (= base motor holder)
    encloses 74% of servo 1 and sits on the base.'
  plain:
    do:
      - text: 'Slide the base motor holder down over motor 1 so it sits flat on the base.'
        from: ['source[0]', 'check', 'part:base-motor-holder-so101']
      - text: 'Fix it with 2 small self-tapping screws, one on each side. They go into the base, not into the motor.'
        from: ['source[0]', 'instructions', 'check', 'fasteners']
      - text: 'Bring one cable from motor 1 out through the opening in the base.'
        from: ['check', 'source[1]']
    done:
      text: 'The holder sits flat, one screw on each side, and a cable from motor 1 comes out of the base.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-1
      note: '"Slide over the first motor holder and fasten it using two M2x6mm screws (one on each side)."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Follower step 3: thread one wire out of the middle port of F1, the other into the wire groove of F2'
    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note:
        'placement check (viewer/public/geometry/placements.json): Base_08p (= base motor holder) encloses 74%
        of servo 1 and sits on the base'
    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note: 'placement check (pipeline hole test): both side screws pass through Base_08p holes, horizontal, 16.6 mm from servo 1'
- id: F-013
  slug: follower-joint1-shoulder
  title: Attach the shoulder to the motor 1 horns
  title_short: Attach the shoulder to motor 1
  assembly: follower
  parts:
    - rotation-pitch-so101
    - servo-sts3215-c001-345
  servo_slot: shoulder_pan
  fasteners:
    - id: m3x6
      qty: 8
  tools:
    - screwdriver-ph0
    - screwdriver-ph1
  check: Shoulder holes line up with the horn holes on both ends; 4 M3x6 top, 4 M3x6 bottom.
  provenance:
    'Part role confirmed by placement in the upstream assembly STEP: Rotation_Pitch_SO101 spans servo
    1 (49%) and the servo 2 pocket (42%): the shoulder on the motor-1 horns.'
  plain:
    do:
      - text: 'Set the shoulder over motor 1 so its holes line up with the horn holes at both ends.'
        from: ['check', 'source[0]', 'part:rotation-pitch-so101', 'servo']
      - text: 'Screw it to the horns with 4 M3x6 on top and 4 M3x6 underneath.'
        from: ['source[0]', 'check']
    done:
      text: '8 screws in, 4 on top and 4 underneath, holes lined up at both ends.'
      from: ['check', 'fasteners']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-1
      note:
        '"Attach the shoulder part. Tighten the shoulder part with 4 M3x6mm screws on top and 4 M3x6mm screws
        on the bottom"'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Follower step 4: clamp F3 horizontally along the inner slide at both ends of servo 1'
    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note:
        'placement check (viewer/public/geometry/placements.json): Rotation_Pitch_SO101 spans servo 1 (49%) and
        the servo 2 pocket (42%): the shoulder on the motor-1 horns'
- id: F-014
  slug: follower-joint1-shoulder-motor-holder
  title: Add the shoulder motor holder
  title_short: Add the shoulder motor holder
  assembly: follower
  parts:
    - motor-holder-so101-base
    - rotation-pitch-so101
  servo_slot: shoulder_lift
  check: Holder seated on the shoulder, ready to receive motor 2 from the top.
  instructions:
    "No screws of its own: motor 2's four side screws clamp it in the next step (on each side one enters the
    shoulder, one the holder)."
  provenance:
    'Part role confirmed by placement in the upstream assembly STEP: Motor_holder_SO101_Base encloses
    42% of servo 2, above the shoulder: the shoulder motor holder.'
  plain:
    do:
      - text: "Put the shoulder motor holder on top of the shoulder. It has no screws of its own: motor 2's screws will clamp it in the next step."
        from: ['source[0]', 'instructions', 'check']
    done:
      text: 'The holder sits on the shoulder, open at the top for motor 2.'
      from: ['check']
  source:
    - ref: upstream/lerobot/docs/source/so101.mdx#joint-1
      note: '"Add the shoulder motor holder."'
    - ref: https://www.waveshare.com/w/index.php?title=SO-ARM100/101_Kit_Aassembly&oldid=109741
      retrieved: '2026-09-07'
      note: 'Follower step 5: put F4 on F3'
    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note:
        'placement check (viewer/public/geometry/placements.json): Motor_holder_SO101_Base encloses 42% of servo
        2, above the shoulder: the shoulder motor holder'
    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note: "placement check (pipeline hole test): no fastener passes through this part until motor 2 is fitted; two of motor 2's tab screws then go through Motor_holder_SO101_Base holes"
