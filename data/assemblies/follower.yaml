    - ref: upstream/SO-ARM100/STEP/SO101/SO101 Assembly.step
      note: 'placement check (pipeline hole test): per side one screw through a Rotation_Pitch_SO101 hole and one through a Motor_holder_SO101_Base hole, all horizontal'
