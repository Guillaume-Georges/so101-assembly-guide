      url: https://www.seeedstudio.com/SO-ARM100-Low-Cost-AI-Arm-Kit.html
      includes:
        - printed-frame
        - electronics
      servos: 'Follower: 6x ST-3215-C018 / C047 (12V, 1:345) on a 12V supply; leader as Standard, on 5V.'
      hardware: Not itemised on the wiki.
      source:
        - ref: https://wiki.seeedstudio.com/lerobot_so100m_new/
          retrieved: '2026-09-07'
          note: Specification table; "Arm Kit Pro version ... 12V power supply for the Follower"
